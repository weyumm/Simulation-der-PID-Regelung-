<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=3, minimum-scale=1, user-scalable=no">
    <title>模糊PID控制小游戏</title>
    <link rel="shortcut icon" href="img/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <script src="scripts/matter.min.js"></script>
    <!-- 引入 模糊 PID 脚本 -->
    <script src="scripts/fuzzypid.js?v=1"></script>
    <script src="scripts/teach-fuzzypid.js?v=1"></script>
</head>
<body>
    <div id="top-div">
        <div id="header-div">
            <div class="hori-flex-div">
                <img id="icon-img" src="img/icon.png">
                <p id="title-text">模糊PID仿真小游戏</p>
            </div>
            <div class="hori-flex-div">
                <a href="https://github.com/weyumm/Simulation-der-PID-Regelung-  "><img src="img/code.jpg"/>源码</a>
                <a href="https://weyumm.github.io  "><img src="img/cat.jpg"/>博客</a>
                <a href="https://github.com/weyumm  "><img src="img/blog.jpg"/>主页</a>
                <a href="https://boatchanting.github.io/funthings.html  "><img src="img/link.jpg"/>友链</a>
            </div>
        </div>
        <div id="settings-div">
            <div>
                <table>
                    <th colspan="3" class="table-title">全局设置</th>
                    <tr>
                        <td><p class="param-label">鼠标操作</p></td>
                        <td>
                            <div class="hori-flex-div">
                                <input id="select-ctrl-ball" name="mouse-ctrl" type="radio" checked><label for="select-ctrl-ball">推动小球</label>
                                <input id="select-ctrl-target" name="mouse-ctrl" type="radio"><label for="select-ctrl-target">修改目标</label>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td><p class="param-label">干扰恒力</p></td>
                        <td><input id="static-force-range" class="input-range" type="range" min="-10" max="10" step="0.5" value="0" oninput="onRangeInput(event)"></td>
                        <td><input id="static-force-number" class="input-range-value" type="number" value="0" onchange="updateStaticForce()"></td>
                    </tr>
                </table>
            </div>
            <div class="vert-line-div"></div>
            <div id="fuzzypid-param-div">
                <table>
                    <th colspan="3" class="table-title">模糊PID基础参数</th>
                    <tr>
                        <td><p class="param-label">Kp0 (基础比例)</p></td>
                        <td><input id="fp-kp0-range" class="input-range" type="range" min="0" max="10" step="0.1" value="1.0" oninput="onRangeInput(event)"></td>
                        <td><input id="fp-kp0-number" class="input-range-value" type="number" value="1.0" onchange="updateFPParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">Ki0 (基础积分)</p></td>
                        <td><input id="fp-ki0-range" class="input-range" type="range" min="0" max="1" step="0.01" value="0.01" oninput="onRangeInput(event)"></td>
                        <td><input id="fp-ki0-number" class="input-range-value" type="number" value="0.01" onchange="updateFPParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">Kd0 (基础微分)</p></td>
                        <td><input id="fp-kd0-range" class="input-range" type="range" min="0" max="10" step="0.1" value="0.1" oninput="onRangeInput(event)"></td>
                        <td><input id="fp-kd0-number" class="input-range-value" type="number" value="0.1" onchange="updateFPParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">积分限幅</p></td>
                        <td><input id="fp-mi-range" class="input-range" type="range" min="0" max="100" step="0.1" value="20" oninput="onRangeInput(event)"></td>
                        <td><input id="fp-mi-number" class="input-range-value" type="number" value="20" onchange="updateFPParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">输出限幅</p></td>
                        <td><input id="fp-mo-range" class="input-range" type="range" min="0" max="100" step="0.1" value="20" oninput="onRangeInput(event)"></td>
                        <td><input id="fp-mo-number" class="input-range-value" type="number" value="20" onchange="updateFPParams()"></td>
                    </tr>
                     <tr>
                        <td><p class="param-label">误差量化因子 Ke</p></td>
                        <td><input id="fp-ke-range" class="input-range" type="range" min="0.01" max="1" step="0.01" value="0.05" oninput="onRangeInput(event)"></td>
                        <td><input id="fp-ke-number" class="input-range-value" type="number" value="0.05" onchange="updateFPParams()"></td>
                    </tr>
                     <tr>
                        <td><p class="param-label">误差变化率量化因子 Kec</p></td>
                        <td><input id="fp-kec-range" class="input-range" type="range" min="0.01" max="1" step="0.01" value="0.05" oninput="onRangeInput(event)"></td>
                        <td><input id="fp-kec-number" class="input-range-value" type="number" value="0.05" onchange="updateFPParams()"></td>
                    </tr>
                     <tr>
                        <td><p class="param-label">dKp 输出因子 Ku_p</p></td>
                        <td><input id="fp-kup-range" class="input-range" type="range" min="0.1" max="10" step="0.1" value="1.0" oninput="onRangeInput(event)"></td>
                        <td><input id="fp-kup-number" class="input-range-value" type="number" value="1.0" onchange="updateFPParams()"></td>
                    </tr>
                     <tr>
                        <td><p class="param-label">dKi 输出因子 Ku_i</p></td>
                        <td><input id="fp-kui-range" class="input-range" type="range" min="0.1" max="10" step="0.1" value="1.0" oninput="onRangeInput(event)"></td>
                        <td><input id="fp-kui-number" class="input-range-value" type="number" value="1.0" onchange="updateFPParams()"></td>
                    </tr>
                     <tr>
                        <td><p class="param-label">dKd 输出因子 Ku_d</p></td>
                        <td><input id="fp-kud-range" class="input-range" type="range" min="0.1" max="10" step="0.1" value="1.0" oninput="onRangeInput(event)"></td>
                        <td><input id="fp-kud-number" class="input-range-value" type="number" value="1.0" onchange="updateFPParams()"></td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
    <div id="teach-div">
        <div class="vert-flex-div">
            <button id="teach-prev-btn" onclick="onTeachStep(false);">上一步</button>
            <button id="teach-next-btn" onclick="onTeachStep(true);">下一步</button>
            <p id="teach-step-ratio">0/0</p>
        </div>
        <div id="teach-info-div">
            <p id="teach-info"></p>
        </div>
    </div>
    <canvas id="render-canvas"></canvas>
    <div id="status-float-div" onclick="onStatusFloatClick(event)">
        <table style="align-self: center;">
            <tr><td><p class="status-label">目标位置</p></td></tr>
            <tr><td><p id="status-target-pos" class="status-label" style="color: green;">000.00</p></td></tr>
            <tr><td><p class="status-label">--------</p></td></tr>
            <tr><td><p class="status-label">当前位置</p></td></tr>
            <tr><td><p id="status-ball-pos" class="status-label" style="color: red;">000.00</p></td></tr>
            <tr><td><p class="status-label">--------</p></td></tr>
            <tr><td><p class="status-label">模糊PID输出</p></td></tr>
            <tr><td><p id="status-fp-out" class="status-label">000.00</p></td></tr>
             <tr><td><p class="status-label">--------</p></td></tr>
            <tr><td><p class="status-label">Kp</p></td></tr>
            <tr><td><p id="status-kp" class="status-label">0.00</p></td></tr>
             <tr><td><p class="status-label">Ki</p></td></tr>
            <tr><td><p id="status-ki" class="status-label">0.00</p></td></tr>
             <tr><td><p class="status-label">Kd</p></td></tr>
            <tr><td><p id="status-kd" class="status-label">0.00</p></td></tr>
        </table>
        <canvas id="scope-canvas"></canvas>
    </div>
    <!-- 物理运算逻辑 -->
    <script type="text/javascript">
        //全局变量定义
        const ballRadius=20;
        var scrWidth=window.innerWidth;
        var scrHeight=window.innerHeight-document.getElementById("top-div").clientHeight;
        var targetPos=scrWidth/2;
        var fuzzyPIDController = null; // FuzzyPID 实例
        var fpForce={x:0,y:0};
        var staticForce={x:0,y:0};
        const histQueueLength=200;
        var histSamples=new Array();

        //matter引擎相关工具
        var Engine=Matter.Engine;
        var Render=Matter.Render;
        var World=Matter.World;
        var Bodies=Matter.Bodies;
        var Body=Matter.Body;
        var MouseConstraint=Matter.MouseConstraint;
        var Mouse=Matter.Mouse;
        var Events=Matter.Events;

        //创建引擎，取消重力
        var engine=Engine.create({
            gravity:{x:0,y:0}
        });

        //在指定canvas上创建渲染器
        var render=Render.create({
            canvas:document.getElementById("render-canvas"),
            engine:engine,
            options:{
                showVelocity:false,
                width:scrWidth,
                height:scrHeight,
                background:"#F4F3DF",
                wireframes:false
            }
        });

        //创建鼠标约束
        var mouse=Mouse.create(render.canvas);
        var mouseConstraint=MouseConstraint.create(engine,{
            mouse:mouse,
            constraint:{
                stiffness:0.01,
                render:{visible: false}
            },
            collisionFilter:{group:-1}
        });
        World.add(engine.world,mouseConstraint);

        //创建小球刚体
        var ball=Bodies.circle(scrWidth/2,scrHeight/2,ballRadius,{
            friction:0,
            frictionAir:0,
            restitution:0,
            mass:1000,
            render:{fillStyle:"#F5594A"},
            collisionFilter:{group:-1}
        });
        World.add(engine.world,ball);

        Engine.run(engine);
        Render.run(render);

        var renderContext=render.context;
        function renderDrawLine(x1,y1,x2,y2,width,color,dash){
            if(dash)
                renderContext.setLineDash([5,5]);
            else
                renderContext.setLineDash([5,0]);
            renderContext.lineWidth=width;
            renderContext.strokeStyle=color;
            renderContext.beginPath();
            renderContext.moveTo(x1,y1);
            renderContext.lineTo(x2,y2);
            renderContext.closePath();
            renderContext.stroke();
        }
        Events.on(render,"afterRender",function(event){
            renderDrawLine(0,scrHeight/2,scrWidth,scrHeight/2,1,"gray",true);
            if (fpForce) {
                renderDrawLine(ball.position.x,scrHeight/2,ball.position.x+fpForce.x*3,scrHeight/2,5,"#388AF5",false); // 模糊PID施力线
            }
            renderDrawLine(targetPos,scrHeight/2-ballRadius/2,targetPos,scrHeight/2+ballRadius/2,3,"#00E06D",false); // 目标位置线
        });

        Events.on(engine,"beforeUpdate",function(event){
            if (staticForce) Body.applyForce(ball,{x:0,y:0},staticForce);
            if (fpForce) Body.applyForce(ball,{x:0,y:0},fpForce);
        });

        //鼠标操作逻辑
        var lastRenderMousePosX=0,isRenderMouseDown=false;
        Events.on(mouseConstraint,"mousedown",function(event){
            isRenderMouseDown=true;
            lastRenderMousePosX=event.mouse.position.x;
        });
        Events.on(mouseConstraint,"mousemove",function(event){
            if(isRenderMouseDown){
                var nowPosX=event.mouse.position.x;
                var speed=nowPosX-lastRenderMousePosX;
                if(document.getElementById("select-ctrl-ball").checked)
                    ball.position.x+=speed*0.1;
                else
                    targetPos+=speed;
                lastRenderMousePosX=nowPosX;
            }
        });
        Events.on(mouseConstraint,"mouseup",function(event){
            isRenderMouseDown=false;
        });

        // 更新干扰恒力
        function updateStaticForce() {
            const value = parseFloat(document.getElementById("static-force-number").value) || 0;
            staticForce.x = value;
        }

        // 更新模糊 PID 参数
        function updateFPParams() {
             if (fuzzyPIDController) {
                // 更新基础 PID 参数
                fuzzyPIDController.Kp0 = parseFloat(document.getElementById("fp-kp0-number").value) || 1.0;
                fuzzyPIDController.Ki0 = parseFloat(document.getElementById("fp-ki0-number").value) || 0.01;
                fuzzyPIDController.Kd0 = parseFloat(document.getElementById("fp-kd0-number").value) || 0.1;
                fuzzyPIDController.maxInt = parseFloat(document.getElementById("fp-mi-number").value) || 20;
                fuzzyPIDController.maxOut = parseFloat(document.getElementById("fp-mo-number").value) || 20;

                // 更新模糊控制参数
                fuzzyPIDController.Ke = parseFloat(document.getElementById("fp-ke-number").value) || 0.05;
                fuzzyPIDController.Kec = parseFloat(document.getElementById("fp-kec-number").value) || 0.05;
                fuzzyPIDController.Ku_p = parseFloat(document.getElementById("fp-kup-number").value) || 1.0;
                fuzzyPIDController.Ku_i = parseFloat(document.getElementById("fp-kui-number").value) || 1.0;
                fuzzyPIDController.Ku_d = parseFloat(document.getElementById("fp-kud-number").value) || 1.0;
             }
        }

        // 滑动条滑动事件
        function onRangeInput(event){
            var valueElement=document.getElementById(event.srcElement.id.replace("range","number"));
            if (valueElement) {
                 valueElement.value=event.srcElement.value;
                 if (typeof valueElement.onchange === 'function') {
                    valueElement.onchange();
                 }
            }
        }

        //状态浮动窗口点击动画响应
        var floatDivExpanded=true;
        function onStatusFloatClick(event){
            var floatDiv=document.getElementById("status-float-div");
            if(floatDiv) {
                if(floatDivExpanded){
                    floatDiv.style.animation="1s status-float-down-anim";
                    floatDiv.style.transform="translateY(80%)";
                    floatDivExpanded=false;
                }else{
                    floatDiv.style.animation="1s status-float-up-anim";
                    floatDiv.style.transform="translateY(0)";
                    floatDivExpanded=true;
                }
            }
        }

        // --- 延迟启动 模糊PID 定时器逻辑 ---
        Events.on(engine, 'afterUpdate', function() {
            if (ball && !window.fpTimerStarted) {
                // 初始化 模糊 PID 控制器
                try {
                    // 获取初始参数
                    const Kp0 = parseFloat(document.getElementById("fp-kp0-number").value) || 1.0;
                    const Ki0 = parseFloat(document.getElementById("fp-ki0-number").value) || 0.01;
                    const Kd0 = parseFloat(document.getElementById("fp-kd0-number").value) || 0.1;
                    const maxInt = parseFloat(document.getElementById("fp-mi-number").value) || 20;
                    const maxOut = parseFloat(document.getElementById("fp-mo-number").value) || 20;
                    const Ke = parseFloat(document.getElementById("fp-ke-number").value) || 0.05;
                    const Kec = parseFloat(document.getElementById("fp-kec-number").value) || 0.05;
                    const Ku_p = parseFloat(document.getElementById("fp-kup-number").value) || 1.0;
                    const Ku_i = parseFloat(document.getElementById("fp-kui-number").value) || 1.0;
                    const Ku_d = parseFloat(document.getElementById("fp-kud-number").value) || 1.0;

                    fuzzyPIDController = new FuzzyPID(Kp0, Ki0, Kd0, maxInt, maxOut, Ke, Kec, Ku_p, Ku_i, Ku_d);
                    console.log("Fuzzy PID Controller created.");

                    // 启动 模糊 PID 计算定时器 (例如每 20ms 更新一次，与之前的PID一致)
                    setInterval(function(event){
                        if (fuzzyPIDController && ball && ball.position && ball.velocity) {
                            try {
                                // 计算模糊PID输出
                                const output = fuzzyPIDController.calc(targetPos, ball.position.x);
                                fpForce.x = output;

                                // 更新历史数据用于绘图
                                histSamples.push({ target: targetPos, ball: ball.position.x });
                                if (histSamples.length > histQueueLength) histSamples.shift();

                            } catch (e) {
                                console.error("Error in Fuzzy PID calculation or data handling:", e);
                            }
                        }
                    }, 20); // 20ms

                    // 启动状态窗口和示波器更新定时器
                    setInterval(function(){
                        var scope=document.getElementById("scope-canvas");
                        if (scope) {
                            var scopectx=scope.getContext("2d");
                            if (scopectx) {
                                scopectx.clearRect(0,0,scope.width,scope.height);
                                scopectx.lineWidth=1;

                                if (histSamples && histSamples.length > 0 && ball) {
                                    // 绘制位置
                                    const yOffset = scope.height / 2;
                                    const yScale = scope.height / scrWidth;
                                    scopectx.strokeStyle="red";
                                    scopectx.beginPath();
                                    for(var i=0;i<histSamples.length-1;i++){
                                        if (histSamples[i] && histSamples[i+1]) {
                                            scopectx.moveTo(scope.width*i/histQueueLength, yOffset - (histSamples[i].ball - scrWidth/2) * yScale);
                                            scopectx.lineTo(scope.width*(i+1)/histQueueLength, yOffset - (histSamples[i+1].ball - scrWidth/2) * yScale);
                                        }
                                    }
                                    scopectx.stroke();

                                    // 绘制目标
                                    scopectx.strokeStyle="green";
                                    scopectx.beginPath();
                                    scopectx.moveTo(0, yOffset - (targetPos - scrWidth/2) * yScale);
                                    scopectx.lineTo(scope.width, yOffset - (targetPos - scrWidth/2) * yScale);
                                    scopectx.stroke();
                                }
                            }
                        }

                        //更新状态值
                        var targetPosElement = document.getElementById("status-target-pos");
                        var ballPosElement = document.getElementById("status-ball-pos");
                        var fpOutElement = document.getElementById("status-fp-out");
                        var kpElement = document.getElementById("status-kp");
                        var kiElement = document.getElementById("status-ki");
                        var kdElement = document.getElementById("status-kd");
                        if (targetPosElement && ballPosElement && fpOutElement && kpElement && kiElement && kdElement && ball && fuzzyPIDController) {
                            targetPosElement.innerText=targetPos.toFixed(2);
                            ballPosElement.innerText=ball.position.x.toFixed(2);
                            fpOutElement.innerText=(fpForce.x || 0).toFixed(2);
                            // 显示当前动态调整的参数
                            kpElement.innerText = fuzzyPIDController.Kp.toFixed(2);
                            kiElement.innerText = fuzzyPIDController.Ki.toFixed(2);
                            kdElement.innerText = fuzzyPIDController.Kd.toFixed(2);
                        }
                    }, 30); //30ms更新一次

                    window.fpTimerStarted = true;
                    console.log("Fuzzy PID timers started.");
                } catch (e) {
                    console.error("Failed to create initial Fuzzy PID controller:", e);
                }
            }
        });
        // --- 延迟启动结束 ---
    </script>
</body>
</html>
