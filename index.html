<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>控制算法仿真游乐场</title>
    <link rel="shortcut icon" href="img/icon.png" type="image/x-icon">
    <style>
        /* styles.css 内容整合到此处，便于单文件管理 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            backdrop-filter: blur(5px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 800px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            background: linear-gradient(to right, #00c9ff, #92fe9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-top: 10px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            padding: 20px;
            width: 90%;
            max-width: 1000px;
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
        }

        @media (max-width: 480px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        .grid-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.4s ease;
            aspect-ratio: 1 / 1; /* 保持正方形 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-decoration: none;
            color: inherit;
        }

        .grid-item:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            background: rgba(255, 255, 255, 0.15);
        }

        .grid-item h3 {
            margin: 15px 0 10px 0;
            font-size: 1.4rem;
        }

        .grid-item p {
            font-size: 0.9rem;
            opacity: 0.8;
            margin: 0;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        /* 为每个项目设置不同的颜色主题 */
        .item1 { /* 串级PID */
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
        }
        .item1:hover {
            background: linear-gradient(135deg, #ff6b4a, #fea76b);
        }

        .item2 { /* LQR */
            background: linear-gradient(135deg, #00c9ff, #92fe9d);
        }
        .item2:hover {
            background: linear-gradient(135deg, #00b8f0, #83f08d);
        }

        .item3 { /* MPC */
            background: linear-gradient(135deg, #834d9b, #d04ed6);
        }
        .item3:hover {
            background: linear-gradient(135deg, #7a4592, #c745cd);
        }

        .item4 { /* 滑模控制 */
            background: linear-gradient(135deg, #1d976c, #93f9b9);
        }
        .item4:hover {
            background: linear-gradient(135deg, #1a8a62, #88f0ae);
        }

        .item5 { /* 自适应控制 */
            background: linear-gradient(135deg, #4b6cb7, #182848);
        }
        .item5:hover {
            background: linear-gradient(135deg, #4563aa, #152440);
        }

        .item6 { /* 模糊PID */
            background: linear-gradient(135deg, #f85032, #e73827);
        }
        .item6:hover {
            background: linear-gradient(135deg, #f74325, #db3320);
        }

        .item7 { /* Q-learning */
            background: linear-gradient(135deg, #614385, #516395);
        }
        .item7:hover {
            background: linear-gradient(135deg, #593e7c, #495a8a);
        }

        .item8 { /* DQN */
            background: linear-gradient(135deg, #aa4b6b, #6b6b83, #3b8d99);
        }
        .item8:hover {
            background: linear-gradient(135deg, #a34565, #64647a, #368590);
        }

        .item9 { /* DDPG */
            background: linear-gradient(135deg, #11998e, #38ef7d);
        }
        .item9:hover {
            background: linear-gradient(135deg, #108f85, #33e073);
        }

        .footer {
            margin-top: 30px;
            padding: 15px;
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .footer a {
            color: #00c9ff;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>控制算法仿真游乐场</h1>
        <p>探索九种不同的控制策略，从经典PID到先进强化学习</p>
    </div>

    <div class="grid-container">
        <a href="pid.html" class="grid-item item1">

        </a>
        <a href="lqr.html" class="grid-item item2">

        </a>
        <a href="mpc.html" class="grid-item item3">
            <div class="icon">MPC</div>
            <h3>MPC</h3>
            <p>模型预测，未来在握</p>
        </a>
        <a href="slidingmode.html" class="grid-item item4">
            <div class="icon">SMC</div>
            <h3>滑模控制</h3>
            <p>鲁棒性强，不惧干扰</p>
        </a>
        <a href="adaptive.html" class="grid-item item5">
            <div class="icon">Adap</div>
            <h3>自适应控制</h3>
            <p>参数未知，自能调整</p>
        </a>
        <a href="fuzzypid.html" class="grid-item item6">
            <div class="icon">FzPID</div>
            <h3>模糊PID</h3>
            <p>逻辑控制，智能调节</p>
        </a>
        <a href="qlearning.html" class="grid-item item7">
            <div class="icon">Q-L</div>
            <h3>Q-learning</h3>
            <p>强化学习入门</p>
        </a>
        <a href="dqn.html" class="grid-item item8">
            <div class="icon">DQN</div>
            <h3>DQN</h3>
            <p>深度价值网络</p>
        </a>
        <a href="ddpg.html" class="grid-item item9">
            <div class="icon">DDPG</div>
            <h3>DDPG</h3>
            <p>确定性策略梯度</p>
        </a>
    </div>

    <div class="footer">
        <p>探索更多项目 | <a href="https://weyumm.github.io" target="_blank">作者博客</a> | <a href="https://github.com/weyumm" target="_blank">GitHub</a></p>
    </div>
</body>
</html>
