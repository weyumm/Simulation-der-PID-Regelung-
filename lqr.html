<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=3, minimum-scale=1, user-scalable=no">
    <title>LQR控制小游戏</title>
    <link rel="shortcut icon" href="img/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <!-- 1. 添加 numeric.js 矩阵运算库  -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/numeric/1.2.6/numeric.min.js"></script>
    <script src="scripts/matter.min.js"></script>
    <script src="scripts/lqr.js?v=1"></script>
    <script src="scripts/teach-lqr.js?v=4"></script>
</head>
<body>
    <div id="top-div">
        <div id="header-div">
            <div class="hori-flex-div">
                <img id="icon-img" src="img/icon.png">
                <p id="title-text">LQR仿真小游戏</p>
            </div>
            <div class="hori-flex-div">
                <a href="https://github.com/weyumm/Simulation-der-PID-Regelung-  "><img src="img/code.jpg"/>源码</a>
                <a href="https://weyumm.github.io  "><img src="img/cat.jpg"/>博客</a>
                <a href="https://github.com/weyumm  "><img src="img/blog.jpg"/>主页</a>
                <a href="https://boatchanting.github.io/funthings.html  "><img src="img/link.jpg"/>友链</a>
            </div>
        </div>
        <div id="settings-div">
            <div>
                <table>
                    <th colspan="3" class="table-title">全局设置</th>
                    <tr>
                        <td><p class="param-label">教程模式</p></td>
                        <td>
                            <div class="hori-flex-div">
                                <input id="select-teach-on" name="teach-switch" type="radio" onclick="onTeachSwitch(true);"><label for="select-teach-on">开</label>
                                <input id="select-teach-off" name="teach-switch" type="radio" checked onclick="onTeachSwitch(false);"><label for="select-teach-off">关</label>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td><p class="param-label">鼠标操作</p></td>
                        <td>
                            <div class="hori-flex-div">
                                <input id="select-ctrl-ball" name="mouse-ctrl" type="radio" checked><label for="select-ctrl-ball">推动小球</label>
                                <input id="select-ctrl-target" name="mouse-ctrl" type="radio"><label for="select-ctrl-target">修改目标</label>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td><p class="param-label">干扰恒力</p></td>
                        <td><input id="static-force-range" class="input-range" type="range" min="-10" max="10" step="0.5" value="0" oninput="onRangeInput(event)"></td>
                        <td><input id="static-force-number" class="input-range-value" type="number" value="0" onchange="staticForce.x=parseFloat(this.value)"></td>
                    </tr>
                </table>
            </div>
            <div class="vert-line-div"></div>
            <div id="lqr-param-div">
                <table>
                    <th colspan="3" class="table-title">LQR参数</th>
                    <tr>
                        <td><p class="param-label">Q1 (位置权重)</p></td>
                        <td><input id="lqr-q1-range" class="input-range" type="range" min="-10" max="10" step="0.1" value="0.01" oninput="onRangeInput(event)"></td>
                        <td><input id="lqr-q1-number" class="input-range-value" type="number" value="0.01" onchange="updateLQRParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">Q2 (速度权重)</p></td>
                        <td><input id="lqr-q2-range" class="input-range" type="range" min="0" max="10" step="0.1" value="0.1" oninput="onRangeInput(event)"></td>
                        <td><input id="lqr-q2-number" class="input-range-value" type="number" value="0.1" onchange="updateLQRParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">R (控制权重)</p></td>
                        <td><input id="lqr-r-range" class="input-range" type="range" min="0" max="10" step="0.1" value="10.1" oninput="onRangeInput(event)"></td>
                        <td><input id="lqr-r-number" class="input-range-value" type="number" value="10.1" onchange="updateLQRParams()"></td>
                    </tr>
                </table>
            </div>
        </div>
        <div id="teach-div">
            <div class="vert-flex-div">
                <button id="teach-prev-btn" onclick="onTeachStep(false);">上一步</button>
                <button id="teach-next-btn" onclick="onTeachStep(true);">下一步</button>
                <p id="teach-step-ratio">0/0</p>
            </div>
            <div id="teach-info-div">
                <p id="teach-info"></p>
            </div>
        </div>
    </div>

    <canvas id="render-canvas"></canvas>
    <div id="status-float-div" onclick="onStatusFloatClick(event)">
        <table style="align-self: center;">
            <tr><td><p class="status-label">目标位置</p></td></tr>
            <tr><td><p id="status-target-pos" class="status-label" style="color: green;">000.00</p></td></tr>
            <tr><td><p class="status-label">--------</p></td></tr>
            <tr><td><p class="status-label">当前位置</p></td></tr>
            <tr><td><p id="status-ball-pos" class="status-label" style="color: red;">000.00</p></td></tr>
            <tr><td><p class="status-label">--------</p></td></tr>
            <tr><td><p class="status-label">LQR输出</p></td></tr>
            <tr><td><p id="status-lqr-out" class="status-label">000.00</p></td></tr>
        </table>
        <canvas id="scope-canvas"></canvas>
    </div>
    <!-- 物理运算逻辑 -->
    <script type="text/javascript">
        //全局变量定义
        const ballRadius=20;//小球半径
        var scrWidth=window.innerWidth;//渲染画布宽度为屏幕高度
        // 修正 scrHeight 计算 (关键修正点 4)
        var scrHeight=window.innerHeight-document.getElementById("top-div").clientHeight;//渲染画布高度为屏幕高度减去头部配置区域高度
        var targetPos=scrWidth/2;//目标位置
        var lqrController; // 声明但不立即初始化，等待库加载完成
        var lqrForce={x:0,y:0};//LQR计算产生的力
        var staticForce={x:0,y:0};//干扰恒力
        const histQueueLength=200;//历史数据留存个数（用于示波器绘图）
        var histSamples=new Array();//历史数据队列

        //matter引擎相关工具
        var Engine=Matter.Engine;
        var Render=Matter.Render;
        var World=Matter.World;
        var Bodies=Matter.Bodies;
        var Body=Matter.Body;
        var MouseConstraint=Matter.MouseConstraint;
        var Mouse=Matter.Mouse;
        var Events=Matter.Events;

        //创建引擎，取消重力
        var engine=Engine.create({
            gravity:{x:0,y:0}
        });

        //在指定canvas上创建渲染器
        var render=Render.create({
            canvas:document.getElementById("render-canvas"),
            engine:engine,
            options:{
                showVelocity:false, //不显示速度
                width:scrWidth,
                height:scrHeight,
                background:"#F4F3DF", //背景颜色与body一致
                wireframes:false //取消线框模式
            }
        });

        //创建鼠标约束（用于捕获鼠标事件）
        var mouse=Mouse.create(render.canvas);//仅捕捉渲染画布上的事件
        var mouseConstraint=MouseConstraint.create(engine,{
            mouse:mouse,
            constraint:{
                stiffness:0.01,
                render:{visible: false}
            },
            collisionFilter:{group:-1} //不约束小球
        });
        World.add(engine.world,mouseConstraint);

        //创建小球刚体
        var ball=Bodies.circle(scrWidth/2,scrHeight/2,ballRadius,{
            friction:0, //阻力为0
            frictionAir:0,
            restitution:0, //碰撞不反弹
            mass:1000,
            render:{fillStyle:"#F5594A"}, //小球颜色
            collisionFilter:{group:-1} //不被鼠标约束
        });
        World.add(engine.world,ball);

        Engine.run(engine);//运行引擎
        Render.run(render);//运行渲染器

        var renderContext=render.context;//获取渲染器的绘图对象，用于自定义绘图
        //渲染器绘制直线
        function renderDrawLine(x1,y1,x2,y2,width,color,dash){
            if(dash)
                renderContext.setLineDash([5,5]);
            else
                renderContext.setLineDash([5,0]);
            renderContext.lineWidth=width;
            renderContext.strokeStyle=color;
            renderContext.beginPath();
            renderContext.moveTo(x1,y1);
            renderContext.lineTo(x2,y2);
            renderContext.closePath();
            renderContext.stroke();
        }
        //在渲染器完成渲染后进行自定义绘制，否则会被覆盖
        Events.on(render,"afterRender",function(event){
            renderDrawLine(0,scrHeight/2,scrWidth,scrHeight/2,1,"gray",true);//坐标轴线
            // 检查 lqrForce 是否已定义
            if (lqrForce) {
                renderDrawLine(ball.position.x,scrHeight/2,ball.position.x+lqrForce.x*3,scrHeight/2,5,"#388AF5",false);//LQR施力线
            }
            renderDrawLine(targetPos,scrHeight/2-ballRadius/2,targetPos,scrHeight/2+ballRadius/2,3,"#00E06D",false);//目标位置线
        });

        //在引擎更新计算前对小球施加力（每次更新后受力会清零）
        Events.on(engine,"beforeUpdate",function(event){
             // 检查 staticForce 和 lqrForce 是否已定义
            if (staticForce) Body.applyForce(ball,{x:0,y:0},staticForce);
            if (lqrForce) Body.applyForce(ball,{x:0,y:0},lqrForce);
        });

        //鼠标操作逻辑
        var lastRenderMousePosX=0,isRenderMouseDown=false;//上个事件的鼠标位置,当前是否按下
        //注册鼠标按下事件
        Events.on(mouseConstraint,"mousedown",function(event){
            isRenderMouseDown=true;
            lastRenderMousePosX=event.mouse.position.x;
        });
        //注册鼠标移动事件
        Events.on(mouseConstraint,"mousemove",function(event){
            if(isRenderMouseDown){
                var nowPosX=event.mouse.position.x;
                var speed=nowPosX-lastRenderMousePosX;//计算鼠标移动速度（相对上次事件的移动距离）
                if(document.getElementById("select-ctrl-ball").checked)//推动小球模式下修改小球位置
                    ball.position.x+=speed*0.1;
                else //控制目标模式下修改目标位置
                    targetPos+=speed;
                lastRenderMousePosX=nowPosX;//记录本次鼠标位置
            }
        });
        //注册鼠标抬起事件
        Events.on(mouseConstraint,"mouseup",function(event){
            isRenderMouseDown=false;
        });
        
        // 更新LQR参数 (增强安全性)
        function updateLQRParams() {
            const q1Input = document.getElementById("lqr-q1-number");
            const q2Input = document.getElementById("lqr-q2-number");
            const rInput = document.getElementById("lqr-r-number");

            if (!q1Input || !q2Input || !rInput) {
                 console.error("LQR input elements not found.");
                 return;
            }

            const q1 = parseFloat(q1Input.value);
            const q2 = parseFloat(q2Input.value);
            const r = parseFloat(rInput.value);
            
            // 检查参数有效性
            if (isNaN(q1) || isNaN(q2) || isNaN(r) || r <= 0) {
                console.error("Invalid LQR parameters: Q1=" + q1 + ", Q2=" + q2 + ", R=" + r);
                return;
            }
            
            // 使用 try...catch 防止 LQR 构造失败导致崩溃
            try {
                // 重新创建LQR控制器
                lqrController = new LQR([q1, q2], r, 0.02);
                console.log("LQR Controller updated successfully.");
            } catch (e) {
                console.error("Failed to create LQR controller:", e);
                // 可以选择禁用 LQR 功能或提示用户
            }
        }
        
        // --- 延迟启动 LQR 定时器逻辑 (关键修正点 2) ---
        // 等待 Matter.js 初始化和 ball 创建完成
        Events.on(engine, 'afterUpdate', function() {
            // 确保 ball 已经被添加到世界并且 lqrController 已经创建
            if (ball && !window.lqrTimerStarted) {
                // 初始化 LQR 控制器 (在这里初始化更安全)
                try {
                    lqrController = new LQR([0.01, 0.1], 10.1, 0.02); // 使用默认参数初始化
                    console.log("Initial LQR Controller created.");
                    updateLQRParams(); // 应用页面上设置的初始参数
                } catch (e) {
                    console.error("Failed to create initial LQR controller:", e);
                }

                // 启动 LQR 计算定时器
                setInterval(function(event){
                    // 检查 lqrController 和 ball 是否存在
                    if (lqrController && ball && ball.position && ball.velocity) { 
                        try {
                            // 计算LQR输出
                            const output = lqrController.calc(targetPos, ball.position.x, ball.velocity.x);
                            lqrForce.x = output || 0; // 防止 output 为 undefined
                            
                            histSamples.push({ target: targetPos, ball: ball.position.x });
                            if (histSamples.length > histQueueLength) histSamples.shift();
                        } catch (e) {
                            console.error("Error in LQR calculation or data handling:", e);
                        }
                    }
                }, 20); // 20ms

                // 启动状态窗口和示波器更新定时器
                setInterval(function(){
                    //绘制波形
                    var scope=document.getElementById("scope-canvas"); // 在定时器内获取，确保元素存在
                    if (scope) {
                        var scopectx=scope.getContext("2d");
                        if (scopectx) {
                            scopectx.clearRect(0,0,scope.width,scope.height);
                            scopectx.lineWidth=1;
                            
                            // 检查histSamples是否为空且 ball 存在
                            if (histSamples && histSamples.length > 0 && ball) {
                                for(var i=0;i<histSamples.length-1;i++){
                                    if (histSamples[i] && histSamples[i+1]) {
                                        //绘制目标位置
                                        scopectx.strokeStyle="green";
                                        scopectx.beginPath();
                                        scopectx.moveTo(scope.width*i/histQueueLength,scope.height/2-(histSamples[i].target-scrWidth/2)*scope.height/scrWidth);
                                        scopectx.lineTo(scope.width*(i+1)/histQueueLength,scope.height/2-(histSamples[i+1].target-scrWidth/2)*scope.height/scrWidth);
                                        scopectx.closePath();
                                        scopectx.stroke();
                                        //绘制小球位置
                                        scopectx.strokeStyle="red";
                                        scopectx.beginPath();
                                        scopectx.moveTo(scope.width*i/histQueueLength,scope.height/2-(histSamples[i].ball-scrWidth/2)*scope.height/scrWidth);
                                        scopectx.lineTo(scope.width*(i+1)/histQueueLength,scope.height/2-(histSamples[i+1].ball-scrWidth/2)*scope.height/scrWidth);
                                        scopectx.closePath();
                                        scopectx.stroke();
                                    }
                                }
                            }
                        }
                    }
                    
                    //更新状态值 (检查元素和 ball 是否存在)
                    var targetPosElement = document.getElementById("status-target-pos");
                    var ballPosElement = document.getElementById("status-ball-pos");
                    var lqrOutElement = document.getElementById("status-lqr-out");
                    if (targetPosElement && ballPosElement && lqrOutElement && ball) {
                        targetPosElement.innerText=targetPos.toFixed(2);
                        ballPosElement.innerText=ball.position.x.toFixed(2);
                        lqrOutElement.innerText=(lqrForce.x || 0).toFixed(2); // 防止 lqrForce.x 为 undefined
                    }
                },30); //30ms更新一次

                window.lqrTimerStarted = true; // 标记定时器已启动
                console.log("LQR timers started.");
            }
        });
        // --- 延迟启动结束 ---

    </script>
    <!-- 界面元素响应 -->
    <script type="text/javascript">
        //滑动条滑动事件
        function onRangeInput(event){
            var valueElement=document.getElementById(event.srcElement.id.replace("range","number"));//根据id找出对应的数字编辑框
            if (valueElement) { // 检查元素是否存在
                 valueElement.value=event.srcElement.value;//设置编辑框的值
                 // 检查 onchange 是否存在再调用
                 if (typeof valueElement.onchange === 'function') {
                    valueElement.onchange();//触发编辑框改变事件
                 }
            }
        }
        //教程模式切换
        function onTeachSwitch(switchon){
            var teachDiv=document.getElementById("teach-div");//获取窗口div
            if(teachDiv) { // 检查元素是否存在
                if(switchon){ //展开窗口
                    teachDiv.style.animation="1s teach-float-right-anim";
                    teachDiv.style.transform="translateX(0)";
                }else{ //收起窗口
                    teachDiv.style.animation="1s teach-float-left-anim";
                    teachDiv.style.transform="translateX(-100vw)";
                }
            }
        }
        //进入时询问是否开启教程
        window.addEventListener('load', function() { // 确保 DOM 加载完成
            setTimeout(function(){
                if(confirm("是否开启引导教程？")){
                    var teachOnRadio = document.getElementById("select-teach-on");
                    if (teachOnRadio && typeof teachOnRadio.click === 'function') {
                        teachOnRadio.click();
                    }
                }
            },500);
        });
        //状态浮动窗口点击动画响应
        var floatDivExpanded=true;//当前展开状态
        function onStatusFloatClick(event){ //在窗口被点击时调用
            var floatDiv=document.getElementById("status-float-div");//获取窗口div
            if(floatDiv) { // 检查元素是否存在
                if(floatDivExpanded){ //收起窗口
                    floatDiv.style.animation="1s status-float-down-anim";
                    floatDiv.style.transform="translateY(80%)";
                    floatDivExpanded=false;
                }else{ //展开窗口
                    floatDiv.style.animation="1s status-float-up-anim";
                    floatDiv.style.transform="translateY(0)";
                    floatDivExpanded=true;
                }
            }
        }
    </script>
    <!-- 教程窗口更新 -->
    <script type="text/javascript">
        // 等待 teachInfos 加载完成
        function initTeach() {
             var teachInfoText=document.getElementById("teach-info");
             var teachStepRatioText=document.getElementById("teach-step-ratio");
             var teachStep=0;

             // 检查 teachInfos 是否存在且非空
             if (typeof teachInfos !== 'undefined' && teachInfos.length > 0) {
                 if (teachInfoText) teachInfoText.innerHTML=teachInfos[0];
                 if (teachStepRatioText) teachStepRatioText.innerText="1/"+teachInfos.length;
                 
                 window.onTeachStep = function(forward){
                    if(forward && teachStep<teachInfos.length-1){
                        teachStep++;
                    }else if(!forward && teachStep>0){
                        teachStep--;
                    }
                    if (teachInfoText) {
                        teachInfoText.style.animation="0.5s teach-info-enter-anim";
                        teachInfoText.innerHTML=teachInfos[teachStep];
                    }
                    if (teachStepRatioText) {
                        teachStepRatioText.innerText=""+(teachStep+1)+"/"+teachInfos.length;
                    }
                };

                if (teachInfoText) {
                     teachInfoText.onanimationend=function(){
                        teachInfoText.style.animation="";
                    };
                }
             } else {
                 console.warn("teachInfos not found or empty. Hiding teach div.");
                 var teachDiv = document.getElementById("teach-div");
                 if (teachDiv) {
                     teachDiv.style.display = "none";
                 }
             }
        }

         // 等待页面加载完成再初始化教程
        window.addEventListener('load', initTeach);
    </script>
   
</body>
</html>
