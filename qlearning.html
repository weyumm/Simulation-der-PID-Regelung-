<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=3, minimum-scale=1, user-scalable=no">
    <title>Q-Learning 控制小游戏</title>
    <link rel="shortcut icon" href="img/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <script src="scripts/matter.min.js"></script>
    <!-- 引入 Q-Learning 脚本 -->
    <script src="scripts/qlearning.js?v=1"></script>
    <script src="scripts/teach-qlearning.js?v=1"></script>
    <!-- 如果你有教程，可以保留或替换 -->
    <!-- <script src="scripts/teach-info.js?v=4"></script> -->
</head>
<body>
    <div id="top-div">
        <div id="header-div">
            <div class="hori-flex-div">
                <img id="icon-img" src="img/icon.png">
                <p id="title-text">Q-Learning 仿真小游戏</p>
            </div>
            <div class="hori-flex-div">
                <a href="https://github.com/weyumm/Simulation-der-PID-Regelung-  "><img src="img/code.jpg"/>源码</a>
                <a href="https://weyumm.github.io  "><img src="img/cat.jpg"/>博客</a>
                <a href="https://github.com/weyumm  "><img src="img/blog.jpg"/>主页</a>
                <a href="https://boatchanting.github.io/funthings.html  "><img src="img/link.jpg"/>友链</a>
            </div>
        </div>
        <div id="settings-div">
            <div>
                <table>
                    <th colspan="3" class="table-title">全局设置</th>
                    <tr>
                        <td><p class="param-label">鼠标操作</p></td>
                        <td>
                            <div class="hori-flex-div">
                                <input id="select-ctrl-ball" name="mouse-ctrl" type="radio" checked><label for="select-ctrl-ball">推动小球</label>
                                <input id="select-ctrl-target" name="mouse-ctrl" type="radio"><label for="select-ctrl-target">修改目标</label>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td><p class="param-label">干扰恒力</p></td>
                        <td><input id="static-force-range" class="input-range" type="range" min="-10" max="10" step="0.5" value="0" oninput="onRangeInput(event)"></td>
                        <td><input id="static-force-number" class="input-range-value" type="number" value="0" onchange="updateStaticForce()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">训练模式</p></td>
                        <td>
                            <div class="hori-flex-div">
                                <input id="select-train-on" name="train-switch" type="radio" checked onclick="toggleTraining(true);"><label for="select-train-on">开</label>
                                <input id="select-train-off" name="train-switch" type="radio" onclick="toggleTraining(false);"><label for="select-train-off">关</label>
                            </div>
                        </td>
                    </tr>
                </table>
            </div>
            <div class="vert-line-div"></div>
            <div id="qlearning-param-div">
                <table>
                    <th colspan="3" class="table-title">Q-Learning 参数</th>
                    <tr>
                        <td><p class="param-label">学习率 α</p></td>
                        <td><input id="ql-alpha-range" class="input-range" type="range" min="0" max="1" step="0.01" value="0.1" oninput="onRangeInput(event)"></td>
                        <td><input id="ql-alpha-number" class="input-range-value" type="number" value="0.1" onchange="updateQLParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">折扣因子 γ</p></td>
                        <td><input id="ql-gamma-range" class="input-range" type="range" min="0" max="1" step="0.01" value="0.9" oninput="onRangeInput(event)"></td>
                        <td><input id="ql-gamma-number" class="input-range-value" type="number" value="0.9" onchange="updateQLParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">探索率 ε</p></td>
                        <td><input id="ql-epsilon-range" class="input-range" type="range" min="0" max="1" step="0.01" value="0.1" oninput="onRangeInput(event)"></td>
                        <td><input id="ql-epsilon-number" class="input-range-value" type="number" value="0.1" onchange="updateQLParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">位置桶数</p></td>
                        <td><input id="ql-pos-buckets-range" class="input-range" type="range" min="5" max="50" step="1" value="20" oninput="onRangeInput(event)"></td>
                        <td><input id="ql-pos-buckets-number" class="input-range-value" type="number" value="20" onchange="updateQLParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">速度桶数</p></td>
                        <td><input id="ql-vel-buckets-range" class="input-range" type="range" min="5" max="50" step="1" value="20" oninput="onRangeInput(event)"></td>
                        <td><input id="ql-vel-buckets-number" class="input-range-value" type="number" value="20" onchange="updateQLParams()"></td>
                    </tr>
                </table>
            </div>
        </div>
        <!-- 如果你有教程，可以保留或替换 -->
        <!-- <div id="teach-div"> ... </div> -->
    </div>
    <div id="teach-div">
    <div class="vert-flex-div">
            <button id="teach-prev-btn" onclick="onTeachStep(false);">上一步</button>
            <button id="teach-next-btn" onclick="onTeachStep(true);">下一步</button>
            <p id="teach-step-ratio">0/0</p>
        </div>
        <div id="teach-info-div">
            <p id="teach-info"></p>
        </div>
    </div>
    <canvas id="render-canvas"></canvas>
    <div id="status-float-div" onclick="onStatusFloatClick(event)">
        <table style="align-self: center;">
            <tr><td><p class="status-label">目标位置</p></td></tr>
            <tr><td><p id="status-target-pos" class="status-label" style="color: green;">000.00</p></td></tr>
            <tr><td><p class="status-label">--------</p></td></tr>
            <tr><td><p class="status-label">当前位置</p></td></tr>
            <tr><td><p id="status-ball-pos" class="status-label" style="color: red;">000.00</p></td></tr>
            <tr><td><p class="status-label">--------</p></td></tr>
            <tr><td><p class="status-label">QL输出</p></td></tr>
            <tr><td><p id="status-ql-out" class="status-label">000.00</p></td></tr>
            <tr><td><p class="status-label">--------</p></td></tr>
            <tr><td><p class="status-label">奖励</p></td></tr>
            <tr><td><p id="status-reward" class="status-label">000.00</p></td></tr>
            <tr><td><p class="status-label">--------</p></td></tr>
            <tr><td><p class="status-label">Episode</p></td></tr>
            <tr><td><p id="status-episode" class="status-label">0</p></td></tr>
        </table>
        <canvas id="scope-canvas"></canvas>
    </div>
    <!-- 物理运算逻辑 -->
    <script type="text/javascript">
        //全局变量定义
        const ballRadius=20;
        var scrWidth=window.innerWidth;
        var scrHeight=window.innerHeight-document.getElementById("top-div").clientHeight;
        var targetPos=scrWidth/2;
        var qlAgent = null; // QLearningAgent 实例
        var qlForce={x:0,y:0};
        var staticForce={x:0,y:0};
        const histQueueLength=200;
        var histSamples=new Array();
        var isTraining = true; // 默认开启训练

        //matter引擎相关工具
        var Engine=Matter.Engine;
        var Render=Matter.Render;
        var World=Matter.World;
        var Bodies=Matter.Bodies;
        var Body=Matter.Body;
        var MouseConstraint=Matter.MouseConstraint;
        var Mouse=Matter.Mouse;
        var Events=Matter.Events;

        //创建引擎，取消重力
        var engine=Engine.create({
            gravity:{x:0,y:0}
        });

        //在指定canvas上创建渲染器
        var render=Render.create({
            canvas:document.getElementById("render-canvas"),
            engine:engine,
            options:{
                showVelocity:false,
                width:scrWidth,
                height:scrHeight,
                background:"#F4F3DF",
                wireframes:false
            }
        });

        //创建鼠标约束
        var mouse=Mouse.create(render.canvas);
        var mouseConstraint=MouseConstraint.create(engine,{
            mouse:mouse,
            constraint:{
                stiffness:0.01,
                render:{visible: false}
            },
            collisionFilter:{group:-1}
        });
        World.add(engine.world,mouseConstraint);

        //创建小球刚体
        var ball=Bodies.circle(scrWidth/2,scrHeight/2,ballRadius,{
            friction:0,
            frictionAir:0,
            restitution:0,
            mass:1000,
            render:{fillStyle:"#F5594A"},
            collisionFilter:{group:-1}
        });
        World.add(engine.world,ball);

        Engine.run(engine);
        Render.run(render);

        var renderContext=render.context;
        function renderDrawLine(x1,y1,x2,y2,width,color,dash){
            if(dash)
                renderContext.setLineDash([5,5]);
            else
                renderContext.setLineDash([5,0]);
            renderContext.lineWidth=width;
            renderContext.strokeStyle=color;
            renderContext.beginPath();
            renderContext.moveTo(x1,y1);
            renderContext.lineTo(x2,y2);
            renderContext.closePath();
            renderContext.stroke();
        }
        Events.on(render,"afterRender",function(event){
            renderDrawLine(0,scrHeight/2,scrWidth,scrHeight/2,1,"gray",true);
            if (qlForce) {
                renderDrawLine(ball.position.x,scrHeight/2,ball.position.x+qlForce.x*3,scrHeight/2,5,"#388AF5",false);
            }
            renderDrawLine(targetPos,scrHeight/2-ballRadius/2,targetPos,scrHeight/2+ballRadius/2,3,"#00E06D",false);
        });

        Events.on(engine,"beforeUpdate",function(event){
            if (staticForce) Body.applyForce(ball,{x:0,y:0},staticForce);
            if (qlForce) Body.applyForce(ball,{x:0,y:0},qlForce);
        });

        //鼠标操作逻辑
        var lastRenderMousePosX=0,isRenderMouseDown=false;
        Events.on(mouseConstraint,"mousedown",function(event){
            isRenderMouseDown=true;
            lastRenderMousePosX=event.mouse.position.x;
        });
        Events.on(mouseConstraint,"mousemove",function(event){
            if(isRenderMouseDown){
                var nowPosX=event.mouse.position.x;
                var speed=nowPosX-lastRenderMousePosX;
                if(document.getElementById("select-ctrl-ball").checked)
                    ball.position.x+=speed*0.1;
                else
                    targetPos+=speed;
                lastRenderMousePosX=nowPosX;
            }
        });
        Events.on(mouseConstraint,"mouseup",function(event){
            isRenderMouseDown=false;
        });

        // 更新干扰恒力
        function updateStaticForce() {
            const value = parseFloat(document.getElementById("static-force-number").value) || 0;
            staticForce.x = value;
        }

        // 更新 QL 参数
        function updateQLParams() {
             if (qlAgent) {
                qlAgent.alpha = parseFloat(document.getElementById("ql-alpha-number").value) || 0.1;
                qlAgent.gamma = parseFloat(document.getElementById("ql-gamma-number").value) || 0.9;
                qlAgent.epsilon = parseFloat(document.getElementById("ql-epsilon-number").value) || 0.1;
                const new_pos_buckets = parseInt(document.getElementById("ql-pos-buckets-number").value) || 20;
                const new_vel_buckets = parseInt(document.getElementById("ql-vel-buckets-number").value) || 20;
                // 如果桶数改变，需要重新初始化 Q-Table
                if (new_pos_buckets !== qlAgent.positionBuckets || new_vel_buckets !== qlAgent.velocityBuckets) {
                    console.log("Reinitializing Q-Table due to bucket change.");
                    qlAgent.positionBuckets = new_pos_buckets;
                    qlAgent.velocityBuckets = new_vel_buckets;
                    qlAgent.initializeQTable();
                }
             }
        }

        // 切换训练模式
        function toggleTraining(train) {
            isTraining = train;
            console.log("Training mode:", isTraining);
        }

        // 滑动条滑动事件
        function onRangeInput(event){
            var valueElement=document.getElementById(event.srcElement.id.replace("range","number"));
            if (valueElement) {
                 valueElement.value=event.srcElement.value;
                 if (typeof valueElement.onchange === 'function') {
                    valueElement.onchange();
                 }
            }
        }

        //状态浮动窗口点击动画响应
        var floatDivExpanded=true;
        function onStatusFloatClick(event){
            var floatDiv=document.getElementById("status-float-div");
            if(floatDiv) {
                if(floatDivExpanded){
                    floatDiv.style.animation="1s status-float-down-anim";
                    floatDiv.style.transform="translateY(80%)";
                    floatDivExpanded=false;
                }else{
                    floatDiv.style.animation="1s status-float-up-anim";
                    floatDiv.style.transform="translateY(0)";
                    floatDivExpanded=true;
                }
            }
        }

        // --- 延迟启动 QL 定时器逻辑 ---
        Events.on(engine, 'afterUpdate', function() {
            if (ball && !window.qlTimerStarted) {
                // 初始化 QL 控制器
                try {
                    // 获取初始参数
                    const alpha = parseFloat(document.getElementById("ql-alpha-number").value) || 0.1;
                    const gamma = parseFloat(document.getElementById("ql-gamma-number").value) || 0.9;
                    const epsilon = parseFloat(document.getElementById("ql-epsilon-number").value) || 0.1;
                    const pos_buckets = parseInt(document.getElementById("ql-pos-buckets-number").value) || 20;
                    const vel_buckets = parseInt(document.getElementById("ql-vel-buckets-number").value) || 20;
                    const actions = [-15, -5, 0, 5, 15]; // 离散动作

                    qlAgent = new QLearningAgent(alpha, gamma, epsilon, pos_buckets, vel_buckets, actions, scrWidth);
                    console.log("QL Agent created.");

                    // 启动 QL 计算定时器 (例如每 50ms 更新一次)
                    setInterval(function(event){
                        if (qlAgent && ball && ball.position && ball.velocity) {
                            try {
                                // 1. 获取当前状态
                                const currentState = qlAgent.getState(ball.position.x, ball.velocity.x, targetPos);

                                // 2. (可选) 根据是否到达目标重置 Episode
                                const error = Math.abs(ball.position.x - targetPos);
                                const isDone = error < 5; // 5像素以内算到达
                                if (isDone) {
                                     qlAgent.currentEpisode++;
                                     // 可以在这里重置小球位置或目标位置来开始新 Episode
                                     // 例如：ball.position.x = scrWidth * Math.random();
                                }

                                // 3. 选择动作 (基于当前策略，可能是训练也可能是测试)
                                const action = qlAgent.chooseAction(currentState, isTraining); // 传入 isTraining 控制探索
                                const forceValue = qlAgent.getActionValue(action);
                                qlForce.x = forceValue;

                                // 4. 计算奖励
                                const reward = qlAgent.getReward(ball.position.x, ball.velocity.x, targetPos, forceValue);

                                // 5. 获取下一个状态 (模拟应用力之后)
                                // 简化处理：假设力立即生效，下一状态就是当前状态（因为物理引擎会更新）
                                // 更精确的方法是预测一步，但在这里我们直接用更新后的状态
                                // 这里我们先保存当前状态和动作，奖励，在下次迭代时用新的状态来更新

                                // 为了简化，我们在这里直接使用当前状态作为下一个状态来计算奖励和更新
                                // (这在严格意义上不完全正确，但对于演示足够了)
                                // 更好的做法是将 s, a, r 存起来，然后在下一个循环用 s' 来更新 Q(s,a)
                                // 我们采用后一种方法：

                                // --- 改进的时序逻辑 ---
                                // 在 qlAgent 内部存储上一步的 (state, action)
                                qlAgent.update(currentState, action, reward, ball.position.x, ball.velocity.x, targetPos, isTraining);

                                // 更新历史数据用于绘图
                                histSamples.push({ target: targetPos, ball: ball.position.x, reward: reward });
                                if (histSamples.length > histQueueLength) histSamples.shift();

                            } catch (e) {
                                console.error("Error in QL calculation or data handling:", e);
                            }
                        }
                    }, 50); // 50ms

                    // 启动状态窗口和示波器更新定时器
                    setInterval(function(){
                        var scope=document.getElementById("scope-canvas");
                        if (scope) {
                            var scopectx=scope.getContext("2d");
                            if (scopectx) {
                                scopectx.clearRect(0,0,scope.width,scope.height);
                                scopectx.lineWidth=1;

                                if (histSamples && histSamples.length > 0 && ball) {
                                    // 绘制位置
                                    const yOffset = scope.height / 2;
                                    const yScale = scope.height / scrWidth;
                                    scopectx.strokeStyle="red";
                                    scopectx.beginPath();
                                    for(var i=0;i<histSamples.length-1;i++){
                                        if (histSamples[i] && histSamples[i+1]) {
                                            scopectx.moveTo(scope.width*i/histQueueLength, yOffset - (histSamples[i].ball - scrWidth/2) * yScale);
                                            scopectx.lineTo(scope.width*(i+1)/histQueueLength, yOffset - (histSamples[i+1].ball - scrWidth/2) * yScale);
                                        }
                                    }
                                    scopectx.stroke();

                                    // 绘制目标
                                    scopectx.strokeStyle="green";
                                    scopectx.beginPath();
                                    scopectx.moveTo(0, yOffset - (targetPos - scrWidth/2) * yScale);
                                    scopectx.lineTo(scope.width, yOffset - (targetPos - scrWidth/2) * yScale);
                                    scopectx.stroke();

                                    // 绘制奖励 (归一化到画布高度)
                                    const maxReward = 10;
                                    const minReward = -100;
                                    scopectx.strokeStyle="blue";
                                    scopectx.beginPath();
                                    for(var i=0;i<histSamples.length-1;i++){
                                        if (histSamples[i] && histSamples[i+1]) {
                                            const normR1 = Math.max(0, Math.min(1, (histSamples[i].reward - minReward) / (maxReward - minReward)));
                                            const normR2 = Math.max(0, Math.min(1, (histSamples[i+1].reward - minReward) / (maxReward - minReward)));
                                            scopectx.moveTo(scope.width*i/histQueueLength, scope.height - normR1 * scope.height);
                                            scopectx.lineTo(scope.width*(i+1)/histQueueLength, scope.height - normR2 * scope.height);
                                        }
                                    }
                                    scopectx.stroke();
                                }
                            }
                        }

                        //更新状态值
                        var targetPosElement = document.getElementById("status-target-pos");
                        var ballPosElement = document.getElementById("status-ball-pos");
                        var qlOutElement = document.getElementById("status-ql-out");
                        var rewardElement = document.getElementById("status-reward");
                        var episodeElement = document.getElementById("status-episode");
                        if (targetPosElement && ballPosElement && qlOutElement && rewardElement && episodeElement && ball && qlAgent) {
                            targetPosElement.innerText=targetPos.toFixed(2);
                            ballPosElement.innerText=ball.position.x.toFixed(2);
                            qlOutElement.innerText=(qlForce.x || 0).toFixed(2);
                            rewardElement.innerText = (histSamples.length ? histSamples[histSamples.length-1].reward : 0).toFixed(2);
                            episodeElement.innerText = qlAgent.currentEpisode;
                        }
                    }, 30); //30ms更新一次

                    window.qlTimerStarted = true;
                    console.log("QL timers started.");
                } catch (e) {
                    console.error("Failed to create initial QL agent:", e);
                }
            }
        });
        // --- 延迟启动结束 ---
    </script>
</body>
</html>
