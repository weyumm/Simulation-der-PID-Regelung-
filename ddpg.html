<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=3, minimum-scale=1, user-scalable=no">
    <title>DDPG 控制小游戏</title>
    <link rel="shortcut icon" href="img/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <!-- 引入 TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="scripts/matter.min.js"></script>
    <!-- 引入 DDPG 脚本 -->
    <script src="scripts/ddpg.js?v=1"></script>
    <script src="scripts/teach-ddpg.js?v=1"></script>
</head>
<body>
    <div id="top-div">
        <div id="header-div">
            <div class="hori-flex-div">
                <img id="icon-img" src="img/icon.png">
                <p id="title-text">DDPG 仿真小游戏</p>
            </div>
            <div class="hori-flex-div">
                <a href="https://github.com/weyumm/Simulation-der-PID-Regelung-  "><img src="img/code.jpg"/>源码</a>
                <a href="https://weyumm.github.io  "><img src="img/cat.jpg"/>博客</a>
                <a href="https://github.com/weyumm  "><img src="img/blog.jpg"/>主页</a>
                <a href="https://boatchanting.github.io/funthings.html  "><img src="img/link.jpg"/>友链</a>
            </div>
        </div>
        <div id="settings-div">
            <div>
                <table>
                    <th colspan="3" class="table-title">全局设置</th>
                    <tr>
                        <td><p class="param-label">鼠标操作</p></td>
                        <td>
                            <div class="hori-flex-div">
                                <input id="select-ctrl-ball" name="mouse-ctrl" type="radio" checked><label for="select-ctrl-ball">推动小球</label>
                                <input id="select-ctrl-target" name="mouse-ctrl" type="radio"><label for="select-ctrl-target">修改目标</label>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td><p class="param-label">干扰恒力</p></td>
                        <td><input id="static-force-range" class="input-range" type="range" min="-10" max="10" step="0.5" value="0" oninput="onRangeInput(event)"></td>
                        <td><input id="static-force-number" class="input-range-value" type="number" value="0" onchange="updateStaticForce()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">训练模式</p></td>
                        <td>
                            <div class="hori-flex-div">
                                <input id="select-train-on" name="train-switch" type="radio" checked onclick="toggleTraining(true);"><label for="select-train-on">开</label>
                                <input id="select-train-off" name="train-switch" type="radio" onclick="toggleTraining(false);"><label for="select-train-off">关</label>
                            </div>
                        </td>
                    </tr>
                </table>
            </div>
            <div class="vert-line-div"></div>
            <div id="ddpg-param-div">
                <table>
                    <th colspan="3" class="table-title">DDPG 参数</th>
                    <!-- Actor 和 Critic 可以有不同的学习率 -->
                    <tr>
                        <td><p class="param-label">Actor 学习率</p></td>
                        <td><input id="ddpg-actor-lr-range" class="input-range" type="range" min="0.0001" max="0.01" step="0.0001" value="0.0001" oninput="onRangeInput(event)"></td>
                        <td><input id="ddpg-actor-lr-number" class="input-range-value" type="number" value="0.0001" onchange="updateDDPGParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">Critic 学习率</p></td>
                        <td><input id="ddpg-critic-lr-range" class="input-range" type="range" min="0.0001" max="0.01" step="0.0001" value="0.001" oninput="onRangeInput(event)"></td>
                        <td><input id="ddpg-critic-lr-number" class="input-range-value" type="number" value="0.001" onchange="updateDDPGParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">折扣因子 γ</p></td>
                        <td><input id="ddpg-gamma-range" class="input-range" type="range" min="0" max="1" step="0.01" value="0.99" oninput="onRangeInput(event)"></td>
                        <td><input id="ddpg-gamma-number" class="input-range-value" type="number" value="0.99" onchange="updateDDPGParams()"></td>
                    </tr>
                    <!-- DDPG 通常使用噪声而不是 epsilon -->
                    <tr>
                        <td><p class="param-label">探索噪声 σ</p></td>
                        <td><input id="ddpg-noise-range" class="input-range" type="range" min="0" max="5" step="0.1" value="2.0" oninput="onRangeInput(event)"></td>
                        <td><input id="ddpg-noise-number" class="input-range-value" type="number" value="2.0" onchange="updateDDPGParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">噪声衰减率</p></td>
                        <td><input id="ddpg-noise-decay-range" class="input-range" type="range" min="0.99" max="1.0" step="0.0001" value="0.999" oninput="onRangeInput(event)"></td>
                        <td><input id="ddpg-noise-decay-number" class="input-range-value" type="number" value="0.999" onchange="updateDDPGParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">经验回放大小</p></td>
                        <td><input id="ddpg-buffer-size-range" class="input-range" type="range" min="1000" max="100000" step="1000" value="50000" oninput="onRangeInput(event)"></td>
                        <td><input id="ddpg-buffer-size-number" class="input-range-value" type="number" value="50000" onchange="updateDDPGParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">Batch Size</p></td>
                        <td><input id="ddpg-batch-size-range" class="input-range" type="range" min="16" max="512" step="16" value="128" oninput="onRangeInput(event)"></td>
                        <td><input id="ddpg-batch-size-number" class="input-range-value" type="number" value="128" onchange="updateDDPGParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">目标网络更新 τ</p></td>
                        <td><input id="ddpg-tau-range" class="input-range" type="range" min="0.001" max="0.1" step="0.001" value="0.005" oninput="onRangeInput(event)"></td>
                        <td><input id="ddpg-tau-number" class="input-range-value" type="number" value="0.005" onchange="updateDDPGParams()"></td>
                    </tr>
                     <tr>
                        <td><p class="param-label">动作范围</p></td>
                        <td><input id="ddpg-action-high-range" class="input-range" type="range" min="5" max="50" step="1" value="20" oninput="onRangeInput(event)"></td>
                        <td><input id="ddpg-action-high-number" class="input-range-value" type="number" value="20" onchange="updateDDPGParams()"></td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
    <div id="teach-div">
        <div class="vert-flex-div">
            <button id="teach-prev-btn" onclick="onTeachStep(false);">上一步</button>
            <button id="teach-next-btn" onclick="onTeachStep(true);">下一步</button>
            <p id="teach-step-ratio">0/0</p>
        </div>
        <div id="teach-info-div">
            <p id="teach-info"></p>
        </div>
    </div>
    <canvas id="render-canvas"></canvas>
    <div id="status-float-div" onclick="onStatusFloatClick(event)">
        <table style="align-self: center;">
            <tr><td><p class="status-label">目标位置</p></td></tr>
            <tr><td><p id="status-target-pos" class="status-label" style="color: green;">000.00</p></td></tr>
            <tr><td><p class="status-label">--------</p></td></tr>
            <tr><td><p class="status-label">当前位置</p></td></tr>
            <tr><td><p id="status-ball-pos" class="status-label" style="color: red;">000.00</p></td></tr>
            <tr><td><p class="status-label">--------</p></td></tr>
            <tr><td><p class="status-label">DDPG输出</p></td></tr>
            <tr><td><p id="status-ddpg-out" class="status-label">000.00</p></td></tr>
            <tr><td><p class="status-label">--------</p></td></tr>
            <tr><td><p class="status-label">奖励</p></td></tr>
            <tr><td><p id="status-reward" class="status-label">000.00</p></td></tr>
            <tr><td><p class="status-label">--------</p></td></tr>
            <tr><td><p class="status-label">Episode</p></td></tr>
            <tr><td><p id="status-episode" class="status-label">0</p></td></tr>
            <tr><td><p class="status-label">--------</p></td></tr>
            <tr><td><p class="status-label">噪声 σ</p></td></tr>
            <tr><td><p id="status-noise" class="status-label">0.00</p></td></tr>
        </table>
        <canvas id="scope-canvas"></canvas>
    </div>
    <!-- 物理运算逻辑 -->
    <script type="text/javascript">
        //全局变量定义
        const ballRadius=20;
        var scrWidth=window.innerWidth;
        var scrHeight=window.innerHeight-document.getElementById("top-div").clientHeight;
        var targetPos=scrWidth/2;
        var ddpgAgent = null; // DDPGAgent 实例
        var ddpgForce={x:0,y:0};
        var staticForce={x:0,y:0};
        const histQueueLength=200;
        var histSamples=new Array();
        var isTraining = true; // 默认开启训练

        //matter引擎相关工具
        var Engine=Matter.Engine;
        var Render=Matter.Render;
        var World=Matter.World;
        var Bodies=Matter.Bodies;
        var Body=Matter.Body;
        var MouseConstraint=Matter.MouseConstraint;
        var Mouse=Matter.Mouse;
        var Events=Matter.Events;

        //创建引擎，取消重力
        var engine=Engine.create({
            gravity:{x:0,y:0}
        });

        //在指定canvas上创建渲染器
        var render=Render.create({
            canvas:document.getElementById("render-canvas"),
            engine:engine,
            options:{
                showVelocity:false,
                width:scrWidth,
                height:scrHeight,
                background:"#F4F3DF",
                wireframes:false
            }
        });

        //创建鼠标约束
        var mouse=Mouse.create(render.canvas);
        var mouseConstraint=MouseConstraint.create(engine,{
            mouse:mouse,
            constraint:{
                stiffness:0.01,
                render:{visible: false}
            },
            collisionFilter:{group:-1}
        });
        World.add(engine.world,mouseConstraint);

        //创建小球刚体
        var ball=Bodies.circle(scrWidth/2,scrHeight/2,ballRadius,{
            friction:0,
            frictionAir:0,
            restitution:0,
            mass:1000,
            render:{fillStyle:"#F5594A"},
            collisionFilter:{group:-1}
        });
        World.add(engine.world,ball);

        Engine.run(engine);
        Render.run(render);

        var renderContext=render.context;
        function renderDrawLine(x1,y1,x2,y2,width,color,dash){
            if(dash)
                renderContext.setLineDash([5,5]);
            else
                renderContext.setLineDash([5,0]);
            renderContext.lineWidth=width;
            renderContext.strokeStyle=color;
            renderContext.beginPath();
            renderContext.moveTo(x1,y1);
            renderContext.lineTo(x2,y2);
            renderContext.closePath();
            renderContext.stroke();
        }
        Events.on(render,"afterRender",function(event){
            renderDrawLine(0,scrHeight/2,scrWidth,scrHeight/2,1,"gray",true);
            if (ddpgForce) {
                renderDrawLine(ball.position.x,scrHeight/2,ball.position.x+ddpgForce.x*3,scrHeight/2,5,"#388AF5",false); // DDPG施力线
            }
            renderDrawLine(targetPos,scrHeight/2-ballRadius/2,targetPos,scrHeight/2+ballRadius/2,3,"#00E06D",false); // 目标位置线
        });

        Events.on(engine,"beforeUpdate",function(event){
            if (staticForce) Body.applyForce(ball,{x:0,y:0},staticForce);
            if (ddpgForce) Body.applyForce(ball,{x:0,y:0},ddpgForce);
        });

        //鼠标操作逻辑
        var lastRenderMousePosX=0,isRenderMouseDown=false;
        Events.on(mouseConstraint,"mousedown",function(event){
            isRenderMouseDown=true;
            lastRenderMousePosX=event.mouse.position.x;
        });
        Events.on(mouseConstraint,"mousemove",function(event){
            if(isRenderMouseDown){
                var nowPosX=event.mouse.position.x;
                var speed=nowPosX-lastRenderMousePosX;
                if(document.getElementById("select-ctrl-ball").checked)
                    ball.position.x+=speed*0.1;
                else
                    targetPos+=speed;
                lastRenderMousePosX=nowPosX;
            }
        });
        Events.on(mouseConstraint,"mouseup",function(event){
            isRenderMouseDown=false;
        });

        // 更新干扰恒力
        function updateStaticForce() {
            const value = parseFloat(document.getElementById("static-force-number").value) || 0;
            staticForce.x = value;
        }

        // 更新 DDPG 参数
        function updateDDPGParams() {
             if (ddpgAgent) {
                ddpgAgent.actorLearningRate = parseFloat(document.getElementById("ddpg-actor-lr-number").value) || 0.0001;
                ddpgAgent.criticLearningRate = parseFloat(document.getElementById("ddpg-critic-lr-number").value) || 0.001;
                ddpgAgent.gamma = parseFloat(document.getElementById("ddpg-gamma-number").value) || 0.99;
                ddpgAgent.noiseSigma = parseFloat(document.getElementById("ddpg-noise-number").value) || 2.0;
                ddpgAgent.noiseDecay = parseFloat(document.getElementById("ddpg-noise-decay-number").value) || 0.999;
                const newBufferSize = parseInt(document.getElementById("ddpg-buffer-size-number").value) || 50000;
                const newBatchSize = parseInt(document.getElementById("ddpg-batch-size-number").value) || 128;
                ddpgAgent.tau = parseFloat(document.getElementById("ddpg-tau-number").value) || 0.005;
                ddpgAgent.actionHigh = parseFloat(document.getElementById("ddpg-action-high-number").value) || 20;

                // 如果 Buffer 或 Batch Size 改变，可能需要重新配置
                if (newBufferSize !== ddpgAgent.replayBufferSize || newBatchSize !== ddpgAgent.batchSize) {
                     console.log("Replay buffer or batch size changed. Consider re-initializing buffer.");
                     ddpgAgent.replayBufferSize = newBufferSize;
                     ddpgAgent.batchSize = newBatchSize;
                     ddpgAgent.replayBuffer = []; // Clear and reset
                }
                // 注意：学习率等超参数的动态修改在 tf.js 中比较复杂，通常在创建优化器时就固定了。
                // 这里简化处理，实际应用中可能需要重新编译模型或创建新的优化器。
             }
        }

        // 切换训练模式
        function toggleTraining(train) {
            isTraining = train;
            console.log("Training mode:", isTraining);
        }

        // 滑动条滑动事件
        function onRangeInput(event){
            var valueElement=document.getElementById(event.srcElement.id.replace("range","number"));
            if (valueElement) {
                 valueElement.value=event.srcElement.value;
                 if (typeof valueElement.onchange === 'function') {
                    valueElement.onchange();
                 }
            }
        }

        //状态浮动窗口点击动画响应
        var floatDivExpanded=true;
        function onStatusFloatClick(event){
            var floatDiv=document.getElementById("status-float-div");
            if(floatDiv) {
                if(floatDivExpanded){
                    floatDiv.style.animation="1s status-float-down-anim";
                    floatDiv.style.transform="translateY(80%)";
                    floatDivExpanded=false;
                }else{
                    floatDiv.style.animation="1s status-float-up-anim";
                    floatDiv.style.transform="translateY(0)";
                    floatDivExpanded=true;
                }
            }
        }

        // --- 延迟启动 DDPG 定时器逻辑 ---
        Events.on(engine, 'afterUpdate', function() {
            if (ball && !window.ddpgTimerStarted) {
                // 初始化 DDPG 控制器
                try {
                    // 获取初始参数
                    const actor_lr = parseFloat(document.getElementById("ddpg-actor-lr-number").value) || 0.0001;
                    const critic_lr = parseFloat(document.getElementById("ddpg-critic-lr-number").value) || 0.001;
                    const gamma = parseFloat(document.getElementById("ddpg-gamma-number").value) || 0.99;
                    const noiseSigma = parseFloat(document.getElementById("ddpg-noise-number").value) || 2.0;
                    const noiseDecay = parseFloat(document.getElementById("ddpg-noise-decay-number").value) || 0.999;
                    const bufferSize = parseInt(document.getElementById("ddpg-buffer-size-number").value) || 50000;
                    const batchSize = parseInt(document.getElementById("ddpg-batch-size-number").value) || 128;
                    const tau = parseFloat(document.getElementById("ddpg-tau-number").value) || 0.005;
                    const actionHigh = parseFloat(document.getElementById("ddpg-action-high-number").value) || 20;
                    const stateSize = 3; // [errorPos, velocity, targetPos]

                    ddpgAgent = new DDPGAgent(
                        stateSize, actor_lr, critic_lr, gamma, noiseSigma, noiseDecay,
                        bufferSize, batchSize, tau, actionHigh
                    );
                    console.log("DDPG Agent created.");

                    // 启动 DDPG 计算定时器 (例如每 50ms 更新一次)
                    setInterval(function(event){
                        if (ddpgAgent && ball && ball.position && ball.velocity) {
                            try {
                                // 1. 获取当前状态 (使用误差作为状态)
                                const errorPos = ball.position.x - targetPos;
                                const currentState = [errorPos, ball.velocity.x, targetPos];

                                // 2. 判断 Episode 是否结束
                                const absError = Math.abs(errorPos);
                                const isDone = absError < 5; // 5像素以内算到达
                                if (isDone) {
                                     ddpgAgent.currentEpisode++;
                                     // 可以重置小球或目标位置
                                }

                                // 3. 选择动作 (Actor 网络输出 + 噪声)
                                const actionValue = ddpgAgent.chooseAction(currentState, isTraining);
                                ddpgForce.x = actionValue; // 动作就是力的大小

                                // 4. 计算奖励
                                const reward = ddpgAgent.getReward(ball.position.x, ball.velocity.x, targetPos, actionValue);

                                // 5. 获取下一个状态
                                const nextErrorPos = ball.position.x - targetPos;
                                const nextState = [nextErrorPos, ball.velocity.x, targetPos];

                                // 6. 存储经验并训练
                                ddpgAgent.remember(currentState, actionValue, reward, nextState, isDone);
                                if (isTraining) {
                                    ddpgAgent.train(); // 执行训练步骤
                                }

                                // 7. 更新历史数据用于绘图
                                histSamples.push({ target: targetPos, ball: ball.position.x, reward: reward, noise: ddpgAgent.noiseSigma });
                                if (histSamples.length > histQueueLength) histSamples.shift();

                                // 8. 更新噪声
                                if (isTraining) {
                                    ddpgAgent.updateNoise();
                                }

                            } catch (e) {
                                console.error("Error in DDPG calculation or data handling:", e);
                            }
                        }
                    }, 50); // 50ms

                    // 启动状态窗口和示波器更新定时器
                    setInterval(function(){
                        var scope=document.getElementById("scope-canvas");
                        if (scope) {
                            var scopectx=scope.getContext("2d");
                            if (scopectx) {
                                scopectx.clearRect(0,0,scope.width,scope.height);
                                scopectx.lineWidth=1;

                                if (histSamples && histSamples.length > 0 && ball) {
                                    // 绘制位置
                                    const yOffset = scope.height / 2;
                                    const yScale = scope.height / scrWidth;
                                    scopectx.strokeStyle="red";
                                    scopectx.beginPath();
                                    for(var i=0;i<histSamples.length-1;i++){
                                        if (histSamples[i] && histSamples[i+1]) {
                                            scopectx.moveTo(scope.width*i/histQueueLength, yOffset - (histSamples[i].ball - scrWidth/2) * yScale);
                                            scopectx.lineTo(scope.width*(i+1)/histQueueLength, yOffset - (histSamples[i+1].ball - scrWidth/2) * yScale);
                                        }
                                    }
                                    scopectx.stroke();

                                    // 绘制目标
                                    scopectx.strokeStyle="green";
                                    scopectx.beginPath();
                                    scopectx.moveTo(0, yOffset - (targetPos - scrWidth/2) * yScale);
                                    scopectx.lineTo(scope.width, yOffset - (targetPos - scrWidth/2) * yScale);
                                    scopectx.stroke();

                                    // 绘制奖励
                                    const maxReward = 10;
                                    const minReward = -100;
                                    scopectx.strokeStyle="blue";
                                    scopectx.beginPath();
                                    for(var i=0;i<histSamples.length-1;i++){
                                        if (histSamples[i] && histSamples[i+1]) {
                                            const normR1 = Math.max(0, Math.min(1, (histSamples[i].reward - minReward) / (maxReward - minReward)));
                                            const normR2 = Math.max(0, Math.min(1, (histSamples[i+1].reward - minReward) / (maxReward - minReward)));
                                            scopectx.moveTo(scope.width*i/histQueueLength, scope.height - normR1 * scope.height);
                                            scopectx.lineTo(scope.width*(i+1)/histQueueLength, scope.height - normR2 * scope.height);
                                        }
                                    }
                                    scopectx.stroke();

                                    // 绘制噪声
                                    scopectx.strokeStyle="orange";
                                    scopectx.beginPath();
                                    for(var i=0;i<histSamples.length-1;i++){
                                        if (histSamples[i] && histSamples[i+1]) {
                                            // 假设噪声 sigma 最大值为 5 (根据滑块范围)
                                            const maxNoise = 5;
                                            const normN1 = Math.max(0, Math.min(1, histSamples[i].noise / maxNoise));
                                            const normN2 = Math.max(0, Math.min(1, histSamples[i+1].noise / maxNoise));
                                            scopectx.moveTo(scope.width*i/histQueueLength, scope.height - normN1 * scope.height);
                                            scopectx.lineTo(scope.width*(i+1)/histQueueLength, scope.height - normN2 * scope.height);
                                        }
                                    }
                                    scopectx.stroke();
                                }
                            }
                        }

                        //更新状态值
                        var targetPosElement = document.getElementById("status-target-pos");
                        var ballPosElement = document.getElementById("status-ball-pos");
                        var ddpgOutElement = document.getElementById("status-ddpg-out");
                        var rewardElement = document.getElementById("status-reward");
                        var episodeElement = document.getElementById("status-episode");
                        var noiseElement = document.getElementById("status-noise");
                        if (targetPosElement && ballPosElement && ddpgOutElement && rewardElement && episodeElement && noiseElement && ball && ddpgAgent) {
                            targetPosElement.innerText=targetPos.toFixed(2);
                            ballPosElement.innerText=ball.position.x.toFixed(2);
                            ddpgOutElement.innerText=(ddpgForce.x || 0).toFixed(2);
                            rewardElement.innerText = (histSamples.length ? histSamples[histSamples.length-1].reward : 0).toFixed(2);
                            episodeElement.innerText = ddpgAgent.currentEpisode;
                            noiseElement.innerText = ddpgAgent.noiseSigma.toFixed(2);
                        }
                    }, 30); //30ms更新一次

                    window.ddpgTimerStarted = true;
                    console.log("DDPG timers started.");
                } catch (e) {
                    console.error("Failed to create initial DDPG agent:", e);
                }
            }
        });
        // --- 延迟启动结束 ---
    </script>
</body>
</html>
