<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=3, minimum-scale=1, user-scalable=no">
    <title>自适应控制小游戏</title>
    <link rel="shortcut icon" href="img/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <script src="scripts/matter.min.js"></script>
    <!-- 引入 自适应控制 脚本 -->
    <script src="scripts/adaptive.js?v=1"></script>
    <script src="scripts/teach-adaptive.js?v=1"></script>
</head>
<body>
    <div id="top-div">
        <div id="header-div">
            <div class="hori-flex-div">
                <img id="icon-img" src="img/icon.png">
                <p id="title-text">自适应控制仿真小游戏</p>
            </div>
            <div class="hori-flex-div">
                <a href="https://github.com/weyumm/Simulation-der-PID-Regelung-  "><img src="img/code.jpg"/>源码</a>
                <a href="https://weyumm.github.io  "><img src="img/cat.jpg"/>博客</a>
                <a href="https://github.com/weyumm  "><img src="img/blog.jpg"/>主页</a>
                <a href="https://boatchanting.github.io/funthings.html  "><img src="img/link.jpg"/>友链</a>
            </div>
        </div>
        <div id="settings-div">
            <div>
                <table>
                    <th colspan="3" class="table-title">全局设置</th>
                    <tr>
                        <td><p class="param-label">鼠标操作</p></td>
                        <td>
                            <div class="hori-flex-div">
                                <input id="select-ctrl-ball" name="mouse-ctrl" type="radio" checked><label for="select-ctrl-ball">推动小球</label>
                                <input id="select-ctrl-target" name="mouse-ctrl" type="radio"><label for="select-ctrl-target">修改目标</label>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td><p class="param-label">干扰恒力</p></td>
                        <td><input id="static-force-range" class="input-range" type="range" min="-10" max="10" step="0.5" value="0" oninput="onRangeInput(event)"></td>
                        <td><input id="static-force-number" class="input-range-value" type="number" value="0" onchange="updateStaticForce()"></td>
                    </tr>
                </table>
            </div>
            <div class="vert-line-div"></div>
            <div id="adaptive-param-div">
                <table>
                    <th colspan="3" class="table-title">自适应控制参数</th>
                    <tr>
                        <td><p class="param-label">参考模型 ωn (自然频率)</p></td>
                        <td><input id="ac-wn-range" class="input-range" type="range" min="1" max="20" step="0.1" value="5.0" oninput="onRangeInput(event)"></td>
                        <td><input id="ac-wn-number" class="input-range-value" type="number" value="5.0" onchange="updateACParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">参考模型 ζ (阻尼比)</p></td>
                        <td><input id="ac-zeta-range" class="input-range" type="range" min="0.1" max="2" step="0.01" value="0.8" oninput="onRangeInput(event)"></td>
                        <td><input id="ac-zeta-number" class="input-range-value" type="number" value="0.8" onchange="updateACParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">估计质量 m_est</p></td>
                        <td><input id="ac-m-est-range" class="input-range" type="range" min="100" max="5000" step="10" value="1000" oninput="onRangeInput(event)"></td>
                        <td><input id="ac-m-est-number" class="input-range-value" type="number" value="1000" onchange="updateACParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">自适应增益 Γ</p></td>
                        <td><input id="ac-gamma-range" class="input-range" type="range" min="0.001" max="1" step="0.001" value="0.1" oninput="onRangeInput(event)"></td>
                        <td><input id="ac-gamma-number" class="input-range-value" type="number" value="0.1" onchange="updateACParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">σ-修改 σ</p></td>
                        <td><input id="ac-sigma-range" class="input-range" type="range" min="0" max="0.1" step="0.0001" value="0.001" oninput="onRangeInput(event)"></td>
                        <td><input id="ac-sigma-number" class="input-range-value" type="number" value="0.001" onchange="updateACParams()"></td>
                    </tr>
                     <tr>
                        <td><p class="param-label">输出限幅</p></td>
                        <td><input id="ac-max-out-range" class="input-range" type="range" min="0" max="100" step="1" value="50" oninput="onRangeInput(event)"></td>
                        <td><input id="ac-max-out-number" class="input-range-value" type="number" value="50" onchange="updateACParams()"></td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
    <div id="teach-div">
        <div class="vert-flex-div">
            <button id="teach-prev-btn" onclick="onTeachStep(false);">上一步</button>
            <button id="teach-next-btn" onclick="onTeachStep(true);">下一步</button>
            <p id="teach-step-ratio">0/0</p>
        </div>
        <div id="teach-info-div">
            <p id="teach-info"></p>
        </div>
    </div>
    <canvas id="render-canvas"></canvas>
    <div id="status-float-div" onclick="onStatusFloatClick(event)">
        <table style="align-self: center;">
            <tr><td><p class="status-label">目标位置</p></td></tr>
            <tr><td><p id="status-target-pos" class="status-label" style="color: green;">000.00</p></td></tr>
            <tr><td><p class="status-label">--------</p></td></tr>
            <tr><td><p class="status-label">当前位置</p></td></tr>
            <tr><td><p id="status-ball-pos" class="status-label" style="color: red;">000.00</p></td></tr>
            <tr><td><p class="status-label">--------</p></td></tr>
            <tr><td><p class="status-label">自适应输出</p></td></tr>
            <tr><td><p id="status-ac-out" class="status-label">000.00</p></td></tr>
             <tr><td><p class="status-label">--------</p></td></tr>
            <tr><td><p class="status-label">参考位置</p></td></tr>
            <tr><td><p id="status-ref-model-pos" class="status-label" style="color: blue;">000.00</p></td></tr>
             <tr><td><p class="status-label">--------</p></td></tr>
            <tr><td><p class="status-label">自适应参数 θ</p></td></tr>
            <tr><td><p id="status-theta" class="status-label">0.00</p></td></tr>
        </table>
        <canvas id="scope-canvas"></canvas>
    </div>
    <!-- 物理运算逻辑 -->
    <script type="text/javascript">
        //全局变量定义
        const ballRadius=20;
        var scrWidth=window.innerWidth;
        var scrHeight=window.innerHeight-document.getElementById("top-div").clientHeight;
        var targetPos=scrWidth/2;
        var adaptiveController = null; // AdaptiveController 实例
        var acForce={x:0,y:0};
        var staticForce={x:0,y:0};
        const histQueueLength=200;
        var histSamples=new Array();

        //matter引擎相关工具
        var Engine=Matter.Engine;
        var Render=Matter.Render;
        var World=Matter.World;
        var Bodies=Matter.Bodies;
        var Body=Matter.Body;
        var MouseConstraint=Matter.MouseConstraint;
        var Mouse=Matter.Mouse;
        var Events=Matter.Events;

        //创建引擎，取消重力
        var engine=Engine.create({
            gravity:{x:0,y:0}
        });

        //在指定canvas上创建渲染器
        var render=Render.create({
            canvas:document.getElementById("render-canvas"),
            engine:engine,
            options:{
                showVelocity:false,
                width:scrWidth,
                height:scrHeight,
                background:"#F4F3DF",
                wireframes:false
            }
        });

        //创建鼠标约束
        var mouse=Mouse.create(render.canvas);
        var mouseConstraint=MouseConstraint.create(engine,{
            mouse:mouse,
            constraint:{
                stiffness:0.01,
                render:{visible: false}
            },
            collisionFilter:{group:-1}
        });
        World.add(engine.world,mouseConstraint);

        //创建小球刚体
        var ball=Bodies.circle(scrWidth/2,scrHeight/2,ballRadius,{
            friction:0,
            frictionAir:0,
            restitution:0,
            mass:1000,
            render:{fillStyle:"#F5594A"},
            collisionFilter:{group:-1}
        });
        World.add(engine.world,ball);

        Engine.run(engine);
        Render.run(render);

        var renderContext=render.context;
        function renderDrawLine(x1,y1,x2,y2,width,color,dash){
            if(dash)
                renderContext.setLineDash([5,5]);
            else
                renderContext.setLineDash([5,0]);
            renderContext.lineWidth=width;
            renderContext.strokeStyle=color;
            renderContext.beginPath();
            renderContext.moveTo(x1,y1);
            renderContext.lineTo(x2,y2);
            renderContext.closePath();
            renderContext.stroke();
        }
        Events.on(render,"afterRender",function(event){
            renderDrawLine(0,scrHeight/2,scrWidth,scrHeight/2,1,"gray",true);
            if (acForce) {
                renderDrawLine(ball.position.x,scrHeight/2,ball.position.x+acForce.x*3,scrHeight/2,5,"#388AF5",false); // 自适应控制施力线
            }
            renderDrawLine(targetPos,scrHeight/2-ballRadius/2,targetPos,scrHeight/2+ballRadius/2,3,"#00E06D",false); // 目标位置线
        });

        Events.on(engine,"beforeUpdate",function(event){
            if (staticForce) Body.applyForce(ball,{x:0,y:0},staticForce);
            if (acForce) Body.applyForce(ball,{x:0,y:0},acForce);
        });

        //鼠标操作逻辑
        var lastRenderMousePosX=0,isRenderMouseDown=false;
        Events.on(mouseConstraint,"mousedown",function(event){
            isRenderMouseDown=true;
            lastRenderMousePosX=event.mouse.position.x;
        });
        Events.on(mouseConstraint,"mousemove",function(event){
            if(isRenderMouseDown){
                var nowPosX=event.mouse.position.x;
                var speed=nowPosX-lastRenderMousePosX;
                if(document.getElementById("select-ctrl-ball").checked)
                    ball.position.x+=speed*0.1;
                else
                    targetPos+=speed;
                lastRenderMousePosX=nowPosX;
            }
        });
        Events.on(mouseConstraint,"mouseup",function(event){
            isRenderMouseDown=false;
        });

        // 更新干扰恒力
        function updateStaticForce() {
            const value = parseFloat(document.getElementById("static-force-number").value) || 0;
            staticForce.x = value;
        }

        // 更新自适应控制参数
        function updateACParams() {
             if (adaptiveController) {
                adaptiveController.wn = parseFloat(document.getElementById("ac-wn-number").value) || 5.0;
                adaptiveController.zeta = parseFloat(document.getElementById("ac-zeta-number").value) || 0.8;
                adaptiveController.m_est = parseFloat(document.getElementById("ac-m-est-number").value) || 1000;
                adaptiveController.gamma = parseFloat(document.getElementById("ac-gamma-number").value) || 0.1;
                adaptiveController.sigma = parseFloat(document.getElementById("ac-sigma-number").value) || 0.001;
                adaptiveController.maxOut = parseFloat(document.getElementById("ac-max-out-number").value) || 50;
             }
        }

        // 滑动条滑动事件
        function onRangeInput(event){
            var valueElement=document.getElementById(event.srcElement.id.replace("range","number"));
            if (valueElement) {
                 valueElement.value=event.srcElement.value;
                 if (typeof valueElement.onchange === 'function') {
                    valueElement.onchange();
                 }
            }
        }

        //状态浮动窗口点击动画响应
        var floatDivExpanded=true;
        function onStatusFloatClick(event){
            var floatDiv=document.getElementById("status-float-div");
            if(floatDiv) {
                if(floatDivExpanded){
                    floatDiv.style.animation="1s status-float-down-anim";
                    floatDiv.style.transform="translateY(80%)";
                    floatDivExpanded=false;
                }else{
                    floatDiv.style.animation="1s status-float-up-anim";
                    floatDiv.style.transform="translateY(0)";
                    floatDivExpanded=true;
                }
            }
        }

        // --- 延迟启动 自适应控制 定时器逻辑 ---
        Events.on(engine, 'afterUpdate', function() {
            if (ball && !window.acTimerStarted) {
                // 初始化 自适应 控制器
                try {
                    // 获取初始参数
                    const wn = parseFloat(document.getElementById("ac-wn-number").value) || 5.0;
                    const zeta = parseFloat(document.getElementById("ac-zeta-number").value) || 0.8;
                    const m_est = parseFloat(document.getElementById("ac-m-est-number").value) || 1000;
                    const gamma = parseFloat(document.getElementById("ac-gamma-number").value) || 0.1;
                    const sigma = parseFloat(document.getElementById("ac-sigma-number").value) || 0.001;
                    const maxOut = parseFloat(document.getElementById("ac-max-out-number").value) || 50;
                    const dt = 0.02; // 仿真步长假设为 20ms

                    adaptiveController = new AdaptiveController(wn, zeta, m_est, gamma, sigma, maxOut, dt);
                    console.log("Adaptive Controller created.");

                    // 启动 自适应控制 计算定时器 (例如每 20ms 更新一次)
                    setInterval(function(event){
                        if (adaptiveController && ball && ball.position && ball.velocity) {
                            try {
                                // 计算自适应控制输出
                                const output = adaptiveController.calc(targetPos, ball.position.x, ball.velocity.x);
                                acForce.x = output;

                                // 更新历史数据用于绘图
                                histSamples.push({
                                    target: targetPos,
                                    ball: ball.position.x,
                                    refModel: adaptiveController.y_m, // 获取参考模型位置
                                    theta: adaptiveController.theta_a // 获取自适应参数
                                });
                                if (histSamples.length > histQueueLength) histSamples.shift();

                            } catch (e) {
                                console.error("Error in Adaptive control calculation or data handling:", e);
                            }
                        }
                    }, 20); // 20ms

                    // 启动状态窗口和示波器更新定时器
                    setInterval(function(){
                        var scope=document.getElementById("scope-canvas");
                        if (scope) {
                            var scopectx=scope.getContext("2d");
                            if (scopectx) {
                                scopectx.clearRect(0,0,scope.width,scope.height);
                                scopectx.lineWidth=1;

                                if (histSamples && histSamples.length > 0 && ball) {
                                    const yOffset = scope.height / 2;
                                    const yScale = scope.height / scrWidth;

                                    // 绘制小球位置 (红色)
                                    scopectx.strokeStyle="red";
                                    scopectx.beginPath();
                                    for(var i=0;i<histSamples.length-1;i++){
                                        if (histSamples[i] && histSamples[i+1]) {
                                            scopectx.moveTo(scope.width*i/histQueueLength, yOffset - (histSamples[i].ball - scrWidth/2) * yScale);
                                            scopectx.lineTo(scope.width*(i+1)/histQueueLength, yOffset - (histSamples[i+1].ball - scrWidth/2) * yScale);
                                        }
                                    }
                                    scopectx.stroke();

                                    // 绘制目标位置 (绿色)
                                    scopectx.strokeStyle="green";
                                    scopectx.beginPath();
                                    scopectx.moveTo(0, yOffset - (targetPos - scrWidth/2) * yScale);
                                    scopectx.lineTo(scope.width, yOffset - (targetPos - scrWidth/2) * yScale);
                                    scopectx.stroke();

                                    // 绘制参考模型位置 (蓝色)
                                    scopectx.strokeStyle="blue";
                                    scopectx.beginPath();
                                    scopectx.setLineDash([5, 5]); // 虚线
                                    for(var i=0;i<histSamples.length-1;i++){
                                        if (histSamples[i] && histSamples[i+1]) {
                                            scopectx.moveTo(scope.width*i/histQueueLength, yOffset - (histSamples[i].refModel - scrWidth/2) * yScale);
                                            scopectx.lineTo(scope.width*(i+1)/histQueueLength, yOffset - (histSamples[i+1].refModel - scrWidth/2) * yScale);
                                        }
                                    }
                                    scopectx.stroke();
                                    scopectx.setLineDash([]); // Reset to solid

                                    // 绘制自适应参数 theta (橙色, 归一化)
                                    const maxTheta = 100;
                                    scopectx.strokeStyle="orange";
                                    scopectx.beginPath();
                                    for(var i=0;i<histSamples.length-1;i++){
                                        if (histSamples[i] && histSamples[i+1]) {
                                            const normT1 = Math.max(0, Math.min(1, Math.abs(histSamples[i].theta) / maxTheta));
                                            const normT2 = Math.max(0, Math.min(1, Math.abs(histSamples[i+1].theta) / maxTheta));
                                            scopectx.moveTo(scope.width*i/histQueueLength, scope.height - normT1 * scope.height);
                                            scopectx.lineTo(scope.width*(i+1)/histQueueLength, scope.height - normT2 * scope.height);
                                        }
                                    }
                                    scopectx.stroke();
                                }
                            }
                        }

                        //更新状态值
                        var targetPosElement = document.getElementById("status-target-pos");
                        var ballPosElement = document.getElementById("status-ball-pos");
                        var acOutElement = document.getElementById("status-ac-out");
                        var refModelPosElement = document.getElementById("status-ref-model-pos");
                        var thetaElement = document.getElementById("status-theta");
                        if (targetPosElement && ballPosElement && acOutElement && refModelPosElement && thetaElement && ball && adaptiveController) {
                            targetPosElement.innerText=targetPos.toFixed(2);
                            ballPosElement.innerText=ball.position.x.toFixed(2);
                            acOutElement.innerText=(acForce.x || 0).toFixed(2);
                            refModelPosElement.innerText = adaptiveController.y_m.toFixed(2);
                            thetaElement.innerText = adaptiveController.theta_a.toFixed(2);
                        }
                    }, 30); //30ms更新一次

                    window.acTimerStarted = true;
                    console.log("Adaptive control timers started.");
                } catch (e) {
                    console.error("Failed to create initial Adaptive controller:", e);
                }
            }
        });
        // --- 延迟启动结束 ---
    </script>
</body>
</html>
