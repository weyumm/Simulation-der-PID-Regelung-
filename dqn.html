<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=3, minimum-scale=1, user-scalable=no">
    <title>DQN 控制小游戏</title>
    <link rel="shortcut icon" href="img/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <!-- 引入 TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="scripts/matter.min.js"></script>
    <!-- 引入 DQN 脚本 -->
    <script src="scripts/dqn.js?v=1"></script>
    <script src="scripts/teach-dqn.js?v=1"></script>
</head>
<body>
    <div id="top-div">
        <div id="header-div">
            <div class="hori-flex-div">
                <img id="icon-img" src="img/icon.png">
                <p id="title-text">DQN 仿真小游戏</p>
            </div>
            <div class="hori-flex-div">
                <a href="https://github.com/weyumm/Simulation-der-PID-Regelung-  "><img src="img/code.jpg"/>源码</a>
                <a href="https://weyumm.github.io  "><img src="img/cat.jpg"/>博客</a>
                <a href="https://github.com/weyumm  "><img src="img/blog.jpg"/>主页</a>
                <a href="https://boatchanting.github.io/funthings.html  "><img src="img/link.jpg"/>友链</a>
            </div>
        </div>
        <div id="settings-div">
            <div>
                <table>
                    <th colspan="3" class="table-title">全局设置</th>
                    <tr>
                        <td><p class="param-label">鼠标操作</p></td>
                        <td>
                            <div class="hori-flex-div">
                                <input id="select-ctrl-ball" name="mouse-ctrl" type="radio" checked><label for="select-ctrl-ball">推动小球</label>
                                <input id="select-ctrl-target" name="mouse-ctrl" type="radio"><label for="select-ctrl-target">修改目标</label>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td><p class="param-label">干扰恒力</p></td>
                        <td><input id="static-force-range" class="input-range" type="range" min="-10" max="10" step="0.5" value="0" oninput="onRangeInput(event)"></td>
                        <td><input id="static-force-number" class="input-range-value" type="number" value="0" onchange="updateStaticForce()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">训练模式</p></td>
                        <td>
                            <div class="hori-flex-div">
                                <input id="select-train-on" name="train-switch" type="radio" checked onclick="toggleTraining(true);"><label for="select-train-on">开</label>
                                <input id="select-train-off" name="train-switch" type="radio" onclick="toggleTraining(false);"><label for="select-train-off">关</label>
                            </div>
                        </td>
                    </tr>
                </table>
            </div>
            <div class="vert-line-div"></div>
            <div id="dqn-param-div">
                <table>
                    <th colspan="3" class="table-title">DQN 参数</th>
                    <tr>
                        <td><p class="param-label">学习率 α</p></td>
                        <td><input id="dqn-lr-range" class="input-range" type="range" min="0.0001" max="0.1" step="0.0001" value="0.001" oninput="onRangeInput(event)"></td>
                        <td><input id="dqn-lr-number" class="input-range-value" type="number" value="0.001" onchange="updateDQNParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">折扣因子 γ</p></td>
                        <td><input id="dqn-gamma-range" class="input-range" type="range" min="0" max="1" step="0.01" value="0.95" oninput="onRangeInput(event)"></td>
                        <td><input id="dqn-gamma-number" class="input-range-value" type="number" value="0.95" onchange="updateDQNParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">初始探索率 ε</p></td>
                        <td><input id="dqn-epsilon-start-range" class="input-range" type="range" min="0" max="1" step="0.01" value="1.0" oninput="onRangeInput(event)"></td>
                        <td><input id="dqn-epsilon-start-number" class="input-range-value" type="number" value="1.0" onchange="updateDQNParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">最终探索率 ε_min</p></td>
                        <td><input id="dqn-epsilon-min-range" class="input-range" type="range" min="0" max="1" step="0.01" value="0.01" oninput="onRangeInput(event)"></td>
                        <td><input id="dqn-epsilon-min-number" class="input-range-value" type="number" value="0.01" onchange="updateDQNParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">探索衰减率 ε_decay</p></td>
                        <td><input id="dqn-epsilon-decay-range" class="input-range" type="range" min="0.99" max="0.9999" step="0.0001" value="0.995" oninput="onRangeInput(event)"></td>
                        <td><input id="dqn-epsilon-decay-number" class="input-range-value" type="number" value="0.995" onchange="updateDQNParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">经验回放大小</p></td>
                        <td><input id="dqn-buffer-size-range" class="input-range" type="range" min="1000" max="100000" step="1000" value="10000" oninput="onRangeInput(event)"></td>
                        <td><input id="dqn-buffer-size-number" class="input-range-value" type="number" value="10000" onchange="updateDQNParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">Batch Size</p></td>
                        <td><input id="dqn-batch-size-range" class="input-range" type="range" min="16" max="512" step="16" value="64" oninput="onRangeInput(event)"></td>
                        <td><input id="dqn-batch-size-number" class="input-range-value" type="number" value="64" onchange="updateDQNParams()"></td>
                    </tr>
                    <tr>
                        <td><p class="param-label">目标网络更新频率</p></td>
                        <td><input id="dqn-target-update-range" class="input-range" type="range" min="10" max="1000" step="10" value="100" oninput="onRangeInput(event)"></td>
                        <td><input id="dqn-target-update-number" class="input-range-value" type="number" value="100" onchange="updateDQNParams()"></td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
    <div id="teach-div">
        <div class="vert-flex-div">
            <button id="teach-prev-btn" onclick="onTeachStep(false);">上一步</button>
            <button id="teach-next-btn" onclick="onTeachStep(true);">下一步</button>
            <p id="teach-step-ratio">0/0</p>
        </div>
        <div id="teach-info-div">
            <p id="teach-info"></p>
        </div>
    </div>
    <canvas id="render-canvas"></canvas>
    <div id="status-float-div" onclick="onStatusFloatClick(event)">
        <table style="align-self: center;">
            <tr><td><p class="status-label">目标位置</p></td></tr>
            <tr><td><p id="status-target-pos" class="status-label" style="color: green;">000.00</p></td></tr>
            <tr><td><p class="status-label">--------</p></td></tr>
            <tr><td><p class="status-label">当前位置</p></td></tr>
            <tr><td><p id="status-ball-pos" class="status-label" style="color: red;">000.00</p></td></tr>
            <tr><td><p class="status-label">--------</p></td></tr>
            <tr><td><p class="status-label">DQN输出</p></td></tr>
            <tr><td><p id="status-dqn-out" class="status-label">000.00</p></td></tr>
            <tr><td><p class="status-label">--------</p></td></tr>
            <tr><td><p class="status-label">奖励</p></td></tr>
            <tr><td><p id="status-reward" class="status-label">000.00</p></td></tr>
            <tr><td><p class="status-label">--------</p></td></tr>
            <tr><td><p class="status-label">Episode</p></td></tr>
            <tr><td><p id="status-episode" class="status-label">0</p></td></tr>
            <tr><td><p class="status-label">--------</p></td></tr>
            <tr><td><p class="status-label">ε</p></td></tr>
            <tr><td><p id="status-epsilon" class="status-label">0.00</p></td></tr>
        </table>
        <canvas id="scope-canvas"></canvas>
    </div>
    <!-- 物理运算逻辑 -->
    <script type="text/javascript">
        //全局变量定义
        const ballRadius=20;
        var scrWidth=window.innerWidth;
        var scrHeight=window.innerHeight-document.getElementById("top-div").clientHeight;
        var targetPos=scrWidth/2;
        var dqnAgent = null; // DQNAgent 实例
        var dqnForce={x:0,y:0};
        var staticForce={x:0,y:0};
        const histQueueLength=200;
        var histSamples=new Array();
        var isTraining = true; // 默认开启训练

        //matter引擎相关工具
        var Engine=Matter.Engine;
        var Render=Matter.Render;
        var World=Matter.World;
        var Bodies=Matter.Bodies;
        var Body=Matter.Body;
        var MouseConstraint=Matter.MouseConstraint;
        var Mouse=Matter.Mouse;
        var Events=Matter.Events;

        //创建引擎，取消重力
        var engine=Engine.create({
            gravity:{x:0,y:0}
        });

        //在指定canvas上创建渲染器
        var render=Render.create({
            canvas:document.getElementById("render-canvas"),
            engine:engine,
            options:{
                showVelocity:false,
                width:scrWidth,
                height:scrHeight,
                background:"#F4F3DF",
                wireframes:false
            }
        });

        //创建鼠标约束
        var mouse=Mouse.create(render.canvas);
        var mouseConstraint=MouseConstraint.create(engine,{
            mouse:mouse,
            constraint:{
                stiffness:0.01,
                render:{visible: false}
            },
            collisionFilter:{group:-1}
        });
        World.add(engine.world,mouseConstraint);

        //创建小球刚体
        var ball=Bodies.circle(scrWidth/2,scrHeight/2,ballRadius,{
            friction:0,
            frictionAir:0,
            restitution:0,
            mass:1000,
            render:{fillStyle:"#F5594A"},
            collisionFilter:{group:-1}
        });
        World.add(engine.world,ball);

        Engine.run(engine);
        Render.run(render);

        var renderContext=render.context;
        function renderDrawLine(x1,y1,x2,y2,width,color,dash){
            if(dash)
                renderContext.setLineDash([5,5]);
            else
                renderContext.setLineDash([5,0]);
            renderContext.lineWidth=width;
            renderContext.strokeStyle=color;
            renderContext.beginPath();
            renderContext.moveTo(x1,y1);
            renderContext.lineTo(x2,y2);
            renderContext.closePath();
            renderContext.stroke();
        }
        Events.on(render,"afterRender",function(event){
            renderDrawLine(0,scrHeight/2,scrWidth,scrHeight/2,1,"gray",true);
            if (dqnForce) {
                renderDrawLine(ball.position.x,scrHeight/2,ball.position.x+dqnForce.x*3,scrHeight/2,5,"#388AF5",false);
            }
            renderDrawLine(targetPos,scrHeight/2-ballRadius/2,targetPos,scrHeight/2+ballRadius/2,3,"#00E06D",false);
        });

        Events.on(engine,"beforeUpdate",function(event){
            if (staticForce) Body.applyForce(ball,{x:0,y:0},staticForce);
            if (dqnForce) Body.applyForce(ball,{x:0,y:0},dqnForce);
        });

        //鼠标操作逻辑
        var lastRenderMousePosX=0,isRenderMouseDown=false;
        Events.on(mouseConstraint,"mousedown",function(event){
            isRenderMouseDown=true;
            lastRenderMousePosX=event.mouse.position.x;
        });
        Events.on(mouseConstraint,"mousemove",function(event){
            if(isRenderMouseDown){
                var nowPosX=event.mouse.position.x;
                var speed=nowPosX-lastRenderMousePosX;
                if(document.getElementById("select-ctrl-ball").checked)
                    ball.position.x+=speed*0.1;
                else
                    targetPos+=speed;
                lastRenderMousePosX=nowPosX;
            }
        });
        Events.on(mouseConstraint,"mouseup",function(event){
            isRenderMouseDown=false;
        });

        // 更新干扰恒力
        function updateStaticForce() {
            const value = parseFloat(document.getElementById("static-force-number").value) || 0;
            staticForce.x = value;
        }

        // 更新 DQN 参数
        function updateDQNParams() {
             if (dqnAgent) {
                dqnAgent.learningRate = parseFloat(document.getElementById("dqn-lr-number").value) || 0.001;
                dqnAgent.gamma = parseFloat(document.getElementById("dqn-gamma-number").value) || 0.95;
                dqnAgent.epsilonStart = parseFloat(document.getElementById("dqn-epsilon-start-number").value) || 1.0;
                dqnAgent.epsilonMin = parseFloat(document.getElementById("dqn-epsilon-min-number").value) || 0.01;
                dqnAgent.epsilonDecay = parseFloat(document.getElementById("dqn-epsilon-decay-number").value) || 0.995;
                dqnAgent.epsilon = dqnAgent.epsilonStart; // Reset epsilon to start value
                const newBufferSize = parseInt(document.getElementById("dqn-buffer-size-number").value) || 10000;
                const newBatchSize = parseInt(document.getElementById("dqn-batch-size-number").value) || 64;
                const newTargetUpdate = parseInt(document.getElementById("dqn-target-update-number").value) || 100;

                // 如果 Buffer 或 Batch Size 改变，可能需要重新配置 (这里简化处理)
                if (newBufferSize !== dqnAgent.replayBufferSize || newBatchSize !== dqnAgent.batchSize) {
                     console.log("Replay buffer or batch size changed. Consider re-initializing buffer.");
                     // 重新初始化 Buffer
                     dqnAgent.replayBufferSize = newBufferSize;
                     dqnAgent.batchSize = newBatchSize;
                     dqnAgent.replayBuffer = []; // Clear and reset
                }
                dqnAgent.targetUpdateFrequency = newTargetUpdate;
             }
        }

        // 切换训练模式
        function toggleTraining(train) {
            isTraining = train;
            console.log("Training mode:", isTraining);
        }

        // 滑动条滑动事件
        function onRangeInput(event){
            var valueElement=document.getElementById(event.srcElement.id.replace("range","number"));
            if (valueElement) {
                 valueElement.value=event.srcElement.value;
                 if (typeof valueElement.onchange === 'function') {
                    valueElement.onchange();
                 }
            }
        }

        //状态浮动窗口点击动画响应
        var floatDivExpanded=true;
        function onStatusFloatClick(event){
            var floatDiv=document.getElementById("status-float-div");
            if(floatDiv) {
                if(floatDivExpanded){
                    floatDiv.style.animation="1s status-float-down-anim";
                    floatDiv.style.transform="translateY(80%)";
                    floatDivExpanded=false;
                }else{
                    floatDiv.style.animation="1s status-float-up-anim";
                    floatDiv.style.transform="translateY(0)";
                    floatDivExpanded=true;
                }
            }
        }

        // --- 延迟启动 DQN 定时器逻辑 ---
        Events.on(engine, 'afterUpdate', function() {
            if (ball && !window.dqnTimerStarted) {
                // 初始化 DQN 控制器
                try {
                    // 获取初始参数
                    const lr = parseFloat(document.getElementById("dqn-lr-number").value) || 0.001;
                    const gamma = parseFloat(document.getElementById("dqn-gamma-number").value) || 0.95;
                    const epsilonStart = parseFloat(document.getElementById("dqn-epsilon-start-number").value) || 1.0;
                    const epsilonMin = parseFloat(document.getElementById("dqn-epsilon-min-number").value) || 0.01;
                    const epsilonDecay = parseFloat(document.getElementById("dqn-epsilon-decay-number").value) || 0.995;
                    const bufferSize = parseInt(document.getElementById("dqn-buffer-size-number").value) || 10000;
                    const batchSize = parseInt(document.getElementById("dqn-batch-size-number").value) || 64;
                    const targetUpdate = parseInt(document.getElementById("dqn-target-update-number").value) || 100;
                    const actions = [-15, -5, 0, 5, 15]; // 离散动作
                    const stateSize = 3; // [errorPos, velocity, targetPos] 或 [pos, vel, targetPos]

                    dqnAgent = new DQNAgent(
                        stateSize, actions, lr, gamma, epsilonStart, epsilonMin, epsilonDecay,
                        bufferSize, batchSize, targetUpdate
                    );
                    console.log("DQN Agent created.");

                    // 启动 DQN 计算定时器 (例如每 50ms 更新一次)
                    setInterval(function(event){
                        if (dqnAgent && ball && ball.position && ball.velocity) {
                            try {
                                // 1. 获取当前状态 (使用误差作为状态更合理)
                                const errorPos = ball.position.x - targetPos;
                                const currentState = [errorPos, ball.velocity.x, targetPos];
                                // 或者 const currentState = [ball.position.x, ball.velocity.x, targetPos];

                                // 2. (可选) 根据是否到达目标重置 Episode
                                const absError = Math.abs(errorPos);
                                const isDone = absError < 5; // 5像素以内算到达
                                if (isDone) {
                                     dqnAgent.currentEpisode++;
                                     // 可以在这里重置小球位置或目标位置来开始新 Episode
                                     // 例如：ball.position.x = scrWidth * Math.random();
                                }

                                // 3. 选择动作 (基于当前策略，可能是训练也可能是测试)
                                const actionIndex = dqnAgent.chooseAction(currentState, isTraining);
                                const forceValue = dqnAgent.actions[actionIndex];
                                dqnForce.x = forceValue;

                                // 4. 计算奖励
                                const reward = dqnAgent.getReward(ball.position.x, ball.velocity.x, targetPos, forceValue);

                                // 5. 获取下一个状态
                                const nextErrorPos = ball.position.x - targetPos; // 这里需要在物理引擎更新后获取，但简单起见我们用当前值
                                const nextState = [nextErrorPos, ball.velocity.x, targetPos];
                                // 或者 const nextState = [ball.position.x, ball.velocity.x, targetPos];

                                // 6. 存储经验并训练
                                dqnAgent.remember(currentState, actionIndex, reward, nextState, isDone);
                                if (isTraining) {
                                    dqnAgent.replay(); // 执行训练步骤
                                }

                                // 7. 更新历史数据用于绘图
                                histSamples.push({ target: targetPos, ball: ball.position.x, reward: reward, epsilon: dqnAgent.epsilon });
                                if (histSamples.length > histQueueLength) histSamples.shift();

                                // 8. 更新探索率
                                if (isTraining) {
                                    dqnAgent.updateEpsilon();
                                }

                            } catch (e) {
                                console.error("Error in DQN calculation or data handling:", e);
                            }
                        }
                    }, 50); // 50ms

                    // 启动状态窗口和示波器更新定时器
                    setInterval(function(){
                        var scope=document.getElementById("scope-canvas");
                        if (scope) {
                            var scopectx=scope.getContext("2d");
                            if (scopectx) {
                                scopectx.clearRect(0,0,scope.width,scope.height);
                                scopectx.lineWidth=1;

                                if (histSamples && histSamples.length > 0 && ball) {
                                    // 绘制位置
                                    const yOffset = scope.height / 2;
                                    const yScale = scope.height / scrWidth;
                                    scopectx.strokeStyle="red";
                                    scopectx.beginPath();
                                    for(var i=0;i<histSamples.length-1;i++){
                                        if (histSamples[i] && histSamples[i+1]) {
                                            scopectx.moveTo(scope.width*i/histQueueLength, yOffset - (histSamples[i].ball - scrWidth/2) * yScale);
                                            scopectx.lineTo(scope.width*(i+1)/histQueueLength, yOffset - (histSamples[i+1].ball - scrWidth/2) * yScale);
                                        }
                                    }
                                    scopectx.stroke();

                                    // 绘制目标
                                    scopectx.strokeStyle="green";
                                    scopectx.beginPath();
                                    scopectx.moveTo(0, yOffset - (targetPos - scrWidth/2) * yScale);
                                    scopectx.lineTo(scope.width, yOffset - (targetPos - scrWidth/2) * yScale);
                                    scopectx.stroke();

                                    // 绘制奖励 (归一化到画布高度)
                                    const maxReward = 10;
                                    const minReward = -100;
                                    scopectx.strokeStyle="blue";
                                    scopectx.beginPath();
                                    for(var i=0;i<histSamples.length-1;i++){
                                        if (histSamples[i] && histSamples[i+1]) {
                                            const normR1 = Math.max(0, Math.min(1, (histSamples[i].reward - minReward) / (maxReward - minReward)));
                                            const normR2 = Math.max(0, Math.min(1, (histSamples[i+1].reward - minReward) / (maxReward - minReward)));
                                            scopectx.moveTo(scope.width*i/histQueueLength, scope.height - normR1 * scope.height);
                                            scopectx.lineTo(scope.width*(i+1)/histQueueLength, scope.height - normR2 * scope.height);
                                        }
                                    }
                                    scopectx.stroke();

                                    // 绘制 epsilon (归一化到画布高度)
                                    scopectx.strokeStyle="orange";
                                    scopectx.beginPath();
                                    for(var i=0;i<histSamples.length-1;i++){
                                        if (histSamples[i] && histSamples[i+1]) {
                                            const normE1 = histSamples[i].epsilon; // Epsilon is already between 0 and 1
                                            const normE2 = histSamples[i+1].epsilon;
                                            scopectx.moveTo(scope.width*i/histQueueLength, scope.height - normE1 * scope.height);
                                            scopectx.lineTo(scope.width*(i+1)/histQueueLength, scope.height - normE2 * scope.height);
                                        }
                                    }
                                    scopectx.stroke();
                                }
                            }
                        }

                        //更新状态值
                        var targetPosElement = document.getElementById("status-target-pos");
                        var ballPosElement = document.getElementById("status-ball-pos");
                        var dqnOutElement = document.getElementById("status-dqn-out");
                        var rewardElement = document.getElementById("status-reward");
                        var episodeElement = document.getElementById("status-episode");
                        var epsilonElement = document.getElementById("status-epsilon");
                        if (targetPosElement && ballPosElement && dqnOutElement && rewardElement && episodeElement && epsilonElement && ball && dqnAgent) {
                            targetPosElement.innerText=targetPos.toFixed(2);
                            ballPosElement.innerText=ball.position.x.toFixed(2);
                            dqnOutElement.innerText=(dqnForce.x || 0).toFixed(2);
                            rewardElement.innerText = (histSamples.length ? histSamples[histSamples.length-1].reward : 0).toFixed(2);
                            episodeElement.innerText = dqnAgent.currentEpisode;
                            epsilonElement.innerText = dqnAgent.epsilon.toFixed(2);
                        }
                    }, 30); //30ms更新一次

                    window.dqnTimerStarted = true;
                    console.log("DQN timers started.");
                } catch (e) {
                    console.error("Failed to create initial DQN agent:", e);
                }
            }
        });
        // --- 延迟启动结束 ---
    </script>
</body>
</html>
